<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<title>Sổ Sắt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#0d1014; --surface:#171d22; --raised:#222a31; --line:#2e3841;
  --chalk:#eef0f3; --muted:#96a1ae; --dim:#68737f;
  --brass:#e0a233; --brass-ink:#17120a; --jade:#43c295; --rust:#cf5c43;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--chalk);
  font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{max-width:640px;margin:0 auto;padding:0 16px calc(90px + env(safe-area-inset-bottom))}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.small{font-size:14px} .tiny{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.stack{display:flex;flex-direction:column;gap:12px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row{display:flex;align-items:center;gap:10px}
h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;
  font-size:21px;font-weight:600;margin:28px 0 8px}
h2:first-child{margin-top:8px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--ground);padding:12px 0 10px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.session{font-family:var(--display);font-size:23px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.session em{font-style:normal;color:var(--brass)}
.bar{height:5px;background:var(--raised);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brass);border-radius:99px;transition:width .25s}
.dots{display:flex;gap:7px;margin-top:11px;overflow-x:auto;padding-bottom:2px}
.dot{flex:none;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface);color:var(--dim);font-family:var(--display);font-size:17px;font-weight:600}
.dot.done{background:#1d3830;border-color:#27503f;color:var(--jade)}
.dot[aria-current=true]{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}

/* ---------- buttons ---------- */
button{font-family:inherit;font-size:16px;cursor:pointer;color:inherit}
.btn{background:var(--brass);color:var(--brass-ink);border:0;border-radius:13px;
  padding:17px 20px;font-weight:600;font-size:17px;min-height:60px;width:100%;
  font-family:var(--display);font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.btn:active{background:#c78e29}
.btn.jade{background:var(--jade);color:#08201a}
.ghost{background:transparent;border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;min-height:52px;font-weight:500}
.ghost:active{background:var(--raised)}
.ghost.sm{min-height:42px;padding:8px 14px;font-size:14px;border-radius:10px}
.ghost.danger{color:var(--rust);border-color:#4d2c25}
.iconbtn{background:transparent;border:1px solid var(--line);color:var(--muted);
  width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:20px;flex:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- exercise ---------- */
.exname{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.08;
  letter-spacing:.01em;margin:2px 0 4px;text-wrap:balance}
.exrx{font-family:var(--display);font-size:18px;letter-spacing:.07em;text-transform:uppercase;color:var(--brass)}
.prev{font-size:14px;color:var(--muted);background:var(--surface);border-left:3px solid var(--brass);
  border-radius:10px;padding:10px 13px;margin:14px 0}
.prev b{color:var(--chalk);font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
details.note{margin-top:14px}
details.note summary{color:var(--muted);font-size:14px;cursor:pointer;list-style:none;padding:6px 0}
details.note summary::-webkit-details-marker{display:none}
details.note summary::before{content:"▸ ";color:var(--dim)}
details.note[open] summary::before{content:"▾ "}
details.note p{margin:4px 0 0;font-size:14px;color:var(--muted);line-height:1.5}

/* ---------- done sets ---------- */
.doneset{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:13px 15px;text-align:left;margin-bottom:8px}
.doneset .tick{color:var(--jade);font-size:18px}
.doneset .val{font-family:var(--display);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;margin-left:auto}
.doneset.editing{border-color:var(--brass)}

/* ---------- stepper ---------- */
.setlabel{font-family:var(--display);font-size:17px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);text-align:center;margin:18px 0 10px}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stepper{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stepper .cap{text-align:center;color:var(--dim);font-size:12.5px;letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:8px}
.stepper .ctrl{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;align-items:center;gap:4px}
.stepper button{background:var(--raised);border:0;border-radius:11px;height:54px;
  font-size:26px;font-family:var(--display);font-weight:600;color:var(--chalk)}
.stepper button:active{background:#2d363f}
.stepper input{width:100%;min-width:0;background:transparent;border:0;color:var(--chalk);text-align:center;
  font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;
  padding:0 2px;min-height:54px;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* ---------- rest timer ---------- */
.rest{background:var(--surface);border:1px solid var(--brass);border-radius:14px;padding:18px;text-align:center}
.rest .lab{font-family:var(--display);font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.rest .clock{font-family:var(--display);font-size:56px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}

/* ---------- generic form ---------- */
input,select,textarea{font-family:var(--body);font-size:16px;background:var(--ground);color:var(--chalk);
  border:1px solid var(--line);border-radius:11px;padding:13px 13px;width:100%;min-height:52px}
input[type=number]{font-family:var(--display);font-size:21px;font-weight:600;text-align:center;
  font-variant-numeric:tabular-nums;padding:10px 6px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
label.f{display:block}
label.f>span{display:block;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.badge{font-family:var(--display);font-size:13px;letter-spacing:.06em;padding:3px 9px;
  border-radius:6px;background:var(--raised);color:var(--muted)}
.badge.up{background:#1d3830;color:var(--jade)} .badge.down{background:#3a251f;color:var(--rust)}
details.sec{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
details.sec>summary{padding:17px 16px;font-family:var(--display);font-size:20px;font-weight:600;
  text-transform:uppercase;letter-spacing:.05em;cursor:pointer;list-style:none;display:flex;
  justify-content:space-between;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";color:var(--brass);font-size:26px;line-height:1}
details.sec[open]>summary::after{content:"–"}
details.sec>.body{padding:0 16px 16px;border-top:1px solid var(--line)}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,16,20,.97);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tab{background:transparent;border:0;color:var(--dim);padding:8px 2px 6px;border-radius:11px;
  display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px}
.tab .ico{font-size:21px;line-height:1}
.tab .lb{font-family:var(--display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.tab[aria-current=page]{color:var(--brass);background:var(--surface)}
.empty{text-align:center;color:var(--dim);padding:44px 16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));
  background:var(--jade);color:#08201a;padding:13px 22px;border-radius:99px;font-weight:600;
  z-index:50;opacity:0;pointer-events:none;transition:opacity .18s;white-space:nowrap}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar"></div>
  <main id="view"></main>
</div>
<nav>
  <button class="tab" data-tab="train"><span class="ico">🏋</span><span class="lb">Tập</span></button>
  <button class="tab" data-tab="history"><span class="ico">📓</span><span class="lb">Nhật ký</span></button>
  <button class="tab" data-tab="me"><span class="ico">⚖</span><span class="lb">Tôi</span></button>
</nav>
<div class="toast" id="toast"></div>
<script>
"use strict";
const KEY = "soSat.v2";
const uid = () => Math.random().toString(36).slice(2, 9);
const today = () => new Date().toISOString().slice(0, 10);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n1 = v => Math.round(v * 10) / 10;
const fmtDate = s => { const [, m, d] = s.split("-"); return d + "/" + m; };
const mmss = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

/* ---------------- dữ liệu khởi tạo ---------------- */
function seed() {
  const ex = (name, sets, reps, start, step, rest, unit, note) =>
    ({ id: uid(), name, sets, reps, start, step, rest, unit: unit || "kg", note: note || "" });
  return {
    profile: { name: "", sex: "m", age: "", height: "", weight: "",
      activity: 1.6, surplus: 450, proteinPerKg: 2, fatPerKg: 1.2,
      goalWeight: "", startDate: today(), weeks: 8 },
    days: [
      { id: uid(), name: "Buổi A", exercises: [
        ex("Back Squat", 3, "6–8", 30, 2.5, 180, "kg", "Bài chính, tập đầu buổi khi còn khoẻ. Xuống tới khi đùi song song sàn. Lưng giữ thẳng, gối mở theo hướng mũi chân."),
        ex("Bench Press", 3, "6–10", 30, 2.5, 150, "kg", "Thay hoàn toàn cho push up. Siết bả vai xuống, chân đạp chắc sàn. Có người đỡ hoặc dùng giá an toàn."),
        ex("Xà đeo tạ", 4, "5–8", 5, 2.5, 150, "+kg", "Balo đựng tạ hoặc đai. Đủ 8 rep ở set cuối 2 buổi liên tiếp thì tăng 2.5kg."),
        ex("Romanian Deadlift", 3, "8–10", 35, 2.5, 120, "kg", "Đùi sau — nhóm cơ đang trống. Đẩy hông ra sau, gối hơi cong, tạ trượt sát chân. Thấy căng đùi sau là đúng."),
        ex("Face Pull", 3, "15", 10, 2.5, 60, "kg", "Chống vai gù do ngồi bàn phím. Kéo dây về phía trán, siết bả vai, đừng nặng quá."),
        ex("Hanging Leg Raise", 3, "10–15", 0, 1, 60, "+kg", "Treo người trên xà, nâng chân bằng cơ bụng. Không đu người lấy đà."),
      ]},
      { id: uid(), name: "Buổi B", exercises: [
        ex("Deadlift", 3, "5", 40, 5, 180, "kg", "Tuần 1–2 tập nhẹ để học form, đừng ăn thua. Lưng thẳng tuyệt đối, đẩy sàn bằng chân chứ không giật bằng lưng."),
        ex("Overhead Press", 3, "6–8", 20, 2.5, 150, "kg", "Pattern đẩy dọc — trước giờ chưa có. Siết mông và bụng để khỏi ưỡn lưng. Đòn không đã là 20kg."),
        ex("Barbell Row", 4, "8–10", 30, 2.5, 120, "kg", "Kéo ngang — nhóm cơ đang trống. Người gập khoảng 45°, kéo tạ về phía rốn."),
        ex("Bulgarian Split Squat", 3, "8–10/chân", 6, 1, 120, "kg/tay", "Rất hợp dân đá banh — sửa lệch chân trái phải. Chân sau gác ghế, dồn lực vào gót chân trước."),
        ex("Lateral Raise", 3, "12–15", 3, 1, 60, "kg/tay", "Vai ngang, giúp nở vai. Nhẹ thôi, nâng tới ngang vai rồi hạ chậm."),
        ex("Hammer Curl", 3, "10–12", 6, 1, 60, "kg/tay", "Tay trước. Lòng bàn tay hướng vào nhau, khuỷu giữ sát người."),
      ]},
    ],
    log: {}, bw: [],
  };
}

/* ---------------- lưu trữ ---------------- */
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || "null");
    if (d && d.profile && Array.isArray(d.days) && d.days.length) return d;
    const old = JSON.parse(localStorage.getItem("soSat.v1") || "null");
    if (old && old.profile && Array.isArray(old.days)) return migrate(old);
  } catch (e) { /* dữ liệu hỏng hoặc trình duyệt chặn — dùng bản mặc định */ }
  return seed();
}
/** v1 chưa có start/step/rest — lấy từ bản mặc định theo tên bài. */
function migrate(old) {
  const base = seed(), byName = {};
  base.days.forEach(d => d.exercises.forEach(e => { byName[e.name] = e; }));
  old.days.forEach(d => d.exercises.forEach(e => {
    const b = byName[e.name] || {};
    if (e.start == null) e.start = b.start != null ? b.start : 0;
    if (e.step == null) e.step = b.step || 2.5;
    if (e.rest == null) e.rest = b.rest || 120;
  }));
  return old;
}
let saveTimer = null;
function save(now) {
  clearTimeout(saveTimer);
  const w = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); }
                    catch (e) { toast("Không lưu được — bộ nhớ bị chặn"); } };
  now ? w() : (saveTimer = setTimeout(w, 300));
}

/* ---------------- trạng thái ---------------- */
let S = load();
let tab = "train";
let curDate = today();
let curDay = null;
let exIdx = 0;
let editIdx = null;
let restEnd = 0, restTimer = null;
let showPicker = false;

let toastTimer = null;
function toast(m) {
  const t = $("#toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ---------------- tính toán ---------------- */
function targets() {
  const p = S.profile, w = +p.weight, h = +p.height, a = +p.age;
  if (!(w > 0 && h > 0 && a > 0)) return null;
  const bmr = 10 * w + 6.25 * h - 5 * a + (p.sex === "m" ? 5 : -161);
  const tdee = bmr * (+p.activity || 1.5);
  const kcal = tdee + (+p.surplus || 0);
  const protein = w * (+p.proteinPerKg || 2);
  const fat = w * (+p.fatPerKg || 1);
  return { bmr, tdee, kcal, protein, fat, carb: Math.max(0, (kcal - protein * 4 - fat * 9) / 4) };
}
function weekNo(d) {
  const s = new Date(S.profile.startDate + "T00:00:00"), x = new Date(d + "T00:00:00");
  if (isNaN(s) || isNaN(x)) return 1;
  return Math.max(1, Math.floor((x - s) / 604800000) + 1);
}
const lkey = (date, dayId, exId) => date + "|" + dayId + "|" + exId;
const sets = (date, dayId, exId) => S.log[lkey(date, dayId, exId)] || [];
const day = () => S.days.find(d => d.id === curDay) || S.days[0];

function sessionDates() {
  const s = new Set();
  for (const k in S.log) if ((S.log[k] || []).length) s.add(k.split("|")[0]);
  return [...s].sort().reverse();
}
function dayOfDate(date) {
  for (const d of S.days) for (const e of d.exercises)
    if (sets(date, d.id, e.id).length) return d.id;
  return null;
}
/** Buổi hôm nay nếu đã ghi; nếu chưa thì buổi kế tiếp sau buổi gần nhất. */
function autoDay() {
  const t = dayOfDate(curDate); if (t) return t;
  for (const dt of sessionDates()) {
    const d = dayOfDate(dt);
    if (d) { const i = S.days.findIndex(x => x.id === d); return S.days[(i + 1) % S.days.length].id; }
  }
  return S.days[0].id;
}
/** Lần gần nhất TRƯỚC ngày đang mở có ghi bài này. */
function lastPerf(exId) {
  let best = null;
  for (const k in S.log) {
    const [d, , e] = k.split("|");
    if (e !== exId || d >= curDate || !(S.log[k] || []).length) continue;
    if (!best || d > best.date) best = { date: d, sets: S.log[k] };
  }
  return best;
}
const repLow = r => { const m = String(r).match(/\d+/); return m ? +m[0] : 8; };
/** Gợi ý tạ/rep: set trước trong buổi → cùng set buổi trước → mức khởi điểm. */
function suggest(ex, i) {
  const cur = sets(curDate, curDay, ex.id);
  if (i > 0 && cur[i - 1]) return { kg: cur[i - 1].kg, reps: cur[i - 1].reps };
  const p = lastPerf(ex.id);
  if (p) { const s = p.sets[Math.min(i, p.sets.length - 1)]; return { kg: s.kg, reps: s.reps }; }
  return { kg: ex.start != null ? ex.start : 0, reps: repLow(ex.reps) };
}
function progress() {
  const d = day(); let done = 0, total = 0;
  d.exercises.forEach(e => { done += Math.min(sets(curDate, d.id, e.id).length, e.sets); total += +e.sets || 0; });
  return { done, total, pct: total ? Math.round(done / total * 100) : 0 };
}
function volume(date) {
  let v = 0;
  for (const k in S.log) if (k.startsWith(date + "|"))
    (S.log[k] || []).forEach(s => { v += (+s.kg || 0) * (+s.reps || 0); });
  return v;
}

/* ---------------- thanh trên cùng ---------------- */
/** "Buổi A" -> Buổi <em>A</em>; escape từng phần rồi mới ghép thẻ. */
function hiName(name) {
  const w = String(name).trim().split(/\s+/);
  return w.length > 1
    ? esc(w.slice(0, -1).join(" ")) + " <em>" + esc(w[w.length - 1]) + "</em>"
    : "<em>" + esc(name) + "</em>";
}
function renderTop() {
  const el = $("#topbar");
  if (tab !== "train") {
    el.innerHTML = `<div class="topline"><div class="session">${tab === "history" ? "Nhật <em>ký</em>" : "Hồ <em>sơ</em>"}</div></div>`;
    return;
  }
  const d = day(), pr = progress();
  const dots = d.exercises.map((e, i) => {
    const n = sets(curDate, d.id, e.id).length;
    return `<button class="dot ${n >= e.sets ? "done" : ""}" data-jump="${i}"
      aria-current="${i === exIdx}" aria-label="${esc(e.name)}">${n >= e.sets ? "✓" : i + 1}</button>`;
  }).join("");
  el.innerHTML = `
    <div class="topline">
      <div>
        <div class="session">${hiName(d.name)}</div>
        <div class="small muted" style="margin-top:-2px">Tuần ${weekNo(curDate)} · ${fmtDate(curDate)} · ${pr.done}/${pr.total} set</div>
      </div>
      <button class="iconbtn" id="pickerBtn" aria-label="Đổi ngày hoặc buổi tập">${showPicker ? "×" : "⋯"}</button>
    </div>
    <div class="bar"><i style="width:${pr.pct}%"></i></div>
    <div class="dots">${dots}</div>`;
}

/* ---------------- TẬP ---------------- */
function viewTrain() {
  const d = day();
  if (!d.exercises.length) return `<div class="empty">Buổi này chưa có bài nào.<br><br>
    <button class="ghost" data-goto="me">Mở Hồ sơ → Chương trình</button></div>`;
  if (exIdx >= d.exercises.length) exIdx = 0;
  const ex = d.exercises[exIdx];
  const done = sets(curDate, d.id, ex.id);
  const total = +ex.sets || 1;
  const idx = editIdx != null ? editIdx : done.length;
  const finished = done.length >= total && editIdx == null;

  let picker = "";
  if (showPicker) {
    picker = `<div class="card stack" style="margin-bottom:16px">
      <label class="f"><span>Ngày tập</span><input type="date" id="dateInput" value="${curDate}"></label>
      <div><span class="tiny muted" style="display:block;margin-bottom:8px">Buổi tập</span>
        <div class="pair">${S.days.map(x =>
          `<button class="ghost" data-day="${x.id}"
            style="${x.id === curDay ? "border-color:var(--brass);color:var(--brass)" : ""}">${esc(x.name)}</button>`).join("")}</div></div>
    </div>`;
  }

  const p = lastPerf(ex.id);
  const prev = p
    ? `<div class="prev">Lần trước · ${fmtDate(p.date)} — ` +
      p.sets.map(s => `<b>${esc(s.kg)}</b>×<b>${esc(s.reps)}</b>`).join(" &nbsp; ") + `</div>`
    : `<div class="prev dim">Chưa có buổi trước — số bạn ghi hôm nay là mốc gốc.</div>`;

  const doneList = done.map((s, i) => `
    <button class="doneset ${editIdx === i ? "editing" : ""}" data-edit="${i}">
      <span class="tick">✓</span><span class="muted">Set ${i + 1}</span>
      <span class="val">${esc(s.kg)} <span style="color:var(--dim)">×</span> ${esc(s.reps)}</span>
    </button>`).join("");

  /* --- khu vực hành động --- */
  let action = "";
  const resting = restEnd > Date.now();

  if (resting) {
    action = `<div class="rest">
      <div class="lab">Nghỉ</div>
      <div class="clock" id="restNum">${mmss(Math.ceil((restEnd - Date.now()) / 1000))}</div>
      <div class="pair" style="margin-top:14px">
        <button class="ghost" id="restAdd">+30 giây</button>
        <button class="ghost" id="restSkip">Bỏ qua</button>
      </div></div>`;
  } else if (finished) {
    const next = exIdx + 1 < d.exercises.length ? d.exercises[exIdx + 1] : null;
    const pr = progress();
    action = next
      ? `<button class="btn jade" data-jump="${exIdx + 1}">Bài tiếp · ${esc(next.name)}</button>`
      : pr.done >= pr.total
        ? `<div class="card" style="text-align:center;border-color:var(--jade)">
            <div class="num" style="font-size:38px;color:var(--jade)">Xong buổi</div>
            <div class="muted small" style="margin-bottom:12px">Tổng khối lượng
              <b class="num" style="color:var(--chalk);font-size:19px">${Math.round(volume(curDate)).toLocaleString("vi-VN")}</b> kg</div>
            <button class="ghost" data-goto="history">Xem nhật ký</button></div>`
        : `<button class="btn" data-jump="0">Quay lại bài chưa xong</button>`;
  } else {
    const sg = editIdx != null ? done[editIdx] : suggest(ex, idx);
    action = `
      <div class="setlabel">${editIdx != null ? "Sửa set " + (editIdx + 1) : "Set " + (idx + 1) + " / " + total}</div>
      <div class="steppers">
        <div class="stepper"><div class="cap">${esc(ex.unit)}</div>
          <div class="ctrl">
            <button data-step="kg:-1" aria-label="Giảm tạ">−</button>
            <input id="kgVal" type="number" inputmode="decimal" step="${ex.step || 2.5}" value="${esc(sg.kg)}" aria-label="Mức tạ">
            <button data-step="kg:1" aria-label="Tăng tạ">+</button>
          </div></div>
        <div class="stepper"><div class="cap">rep · mục tiêu ${esc(ex.reps)}</div>
          <div class="ctrl">
            <button data-step="reps:-1" aria-label="Giảm rep">−</button>
            <input id="repVal" type="number" inputmode="numeric" step="1" value="${esc(sg.reps)}" aria-label="Số rep">
            <button data-step="reps:1" aria-label="Tăng rep">+</button>
          </div></div>
      </div>
      <button class="btn" id="logSet" style="margin-top:14px">
        ${editIdx != null ? "Cập nhật set " + (editIdx + 1) : "✓ Xong set " + (idx + 1)}</button>
      ${editIdx != null ? `<button class="ghost" id="cancelEdit" style="margin-top:10px;width:100%">Huỷ</button>` : ""}`;
  }

  return `${picker}
    <div class="exname">${esc(ex.name)}</div>
    <div class="exrx">${total} set × ${esc(ex.reps)} rep</div>
    ${prev}
    ${doneList}
    ${action}
    ${ex.note ? `<details class="note"><summary>Ghi chú kỹ thuật</summary><p>${esc(ex.note)}</p></details>` : ""}
    <div class="pair" style="margin-top:22px">
      <button class="ghost" data-jump="${exIdx - 1}"${exIdx === 0 ? ' disabled style="opacity:.35"' : ""}>‹ Bài trước</button>
      <button class="ghost" data-jump="${exIdx + 1}"${exIdx >= d.exercises.length - 1 ? ' disabled style="opacity:.35"' : ""}>Bài sau ›</button>
    </div>`;
}

/* ---------------- NHẬT KÝ ---------------- */
function viewHistory() {

  return `<div class="sub">${dates.length} buổi. Khối lượng = tạ × rep cộng dồn — con số này tăng đều nghĩa là bạn đang tiến bộ.</div>

/* ---------------- render ---------------- */
function render() {
  if (!curDay || !S.days.some(d => d.id === curDay)) curDay = autoDay();
  renderTop();
  $("#view").innerHTML = tab === "train" ? viewTrain() : tab === "history" ? viewHistory() : viewMe();
  document.querySelectorAll(".tab").forEach(b =>
    b.dataset.tab === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
}

/* ---------------- đồng hồ nghỉ ---------------- */
let audioCtx = null;
function ensureAudio() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume(); } catch (e) { /* không có audio */ }
}
function buzz() {
  try { if (navigator.vibrate) navigator.vibrate([220, 90, 220]); } catch (e) {}
  try {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t0 = audioCtx.currentTime;
    o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
    o.start(t0); o.stop(t0 + 0.6);
  } catch (e) { /* trình duyệt chặn âm thanh */ }
}
function startRest(sec) {
  if (!sec || sec <= 0) { render(); return; }
  restEnd = Date.now() + sec * 1000;
  render();
  clearInterval(restTimer);
  restTimer = setInterval(() => {
    const left = Math.ceil((restEnd - Date.now()) / 1000);
    if (left <= 0) { clearInterval(restTimer); restTimer = null; restEnd = 0; buzz(); render(); return; }
    const el = $("#restNum"); if (el) el.textContent = mmss(left);
  }, 250);
}
function stopRest() { clearInterval(restTimer); restTimer = null; restEnd = 0; render(); }

function firstUnfinished() {
  const d = day();
  for (let i = 0; i < d.exercises.length; i++)
    if (sets(curDate, d.id, d.exercises[i].id).length < d.exercises[i].sets) return i;
  return 0;
}

/* ---------------- sự kiện ---------------- */
document.querySelectorAll(".tab").forEach(b =>
  b.addEventListener("click", () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); }));

document.addEventListener("click", e => {
  const el = e.target.closest("button"); if (!el) return;

  if (el.dataset.goto) { tab = el.dataset.goto; render(); window.scrollTo(0, 0); return; }
  if (el.id === "pickerBtn") { showPicker = !showPicker; render(); return; }

  if (el.dataset.jump !== undefined) {
    const i = +el.dataset.jump, d = day();
    if (i < 0 || i >= d.exercises.length) return;
    exIdx = i; editIdx = null; render(); window.scrollTo(0, 0); return;
  }
  if (el.dataset.day) {
    curDay = el.dataset.day; exIdx = firstUnfinished(); editIdx = null; showPicker = false; render(); return;
  }
  if (el.dataset.edit !== undefined) {
    editIdx = editIdx === +el.dataset.edit ? null : +el.dataset.edit;
    stopRest(); return;
  }

  if (el.dataset.step) {
    const [f, dir] = el.dataset.step.split(":");
    const ex = day().exercises[exIdx];
    const input = $(f === "kg" ? "#kgVal" : "#repVal");
    const step = f === "kg" ? (+ex.step || 2.5) : 1;
    let v = parseFloat(input.value); if (!isFinite(v)) v = 0;
    v = Math.max(0, Math.round((v + step * +dir) / step) * step);
    input.value = f === "kg" ? String(n1(v)) : String(Math.round(v));
    return;
  }
  if (el.id === "logSet") {
    const d = day(), ex = d.exercises[exIdx];
    const kg = $("#kgVal").value.trim(), reps = $("#repVal").value.trim();
    if (reps === "" || +reps <= 0) { toast("Nhập số rep đã"); return; }
    const k = lkey(curDate, d.id, ex.id);
    if (!S.log[k]) S.log[k] = [];
    S.log[k][editIdx != null ? editIdx : S.log[k].length] = { kg: kg === "" ? "0" : kg, reps };
    save(true);
    if (editIdx != null) { editIdx = null; render(); toast("Đã cập nhật"); return; }
    ensureAudio();
    startRest(+ex.rest || 120);
    return;
  }
  if (el.id === "cancelEdit") { editIdx = null; render(); return; }
  if (el.id === "restAdd") { restEnd += 30000; const n = $("#restNum");
    if (n) n.textContent = mmss(Math.ceil((restEnd - Date.now()) / 1000)); return; }
  if (el.id === "restSkip") { stopRest(); return; }

  if (el.id === "bwAdd") {
    const date = $("#bwDate").value, kg = parseFloat($("#bwKg").value);
    if (!date || !isFinite(kg)) { toast("Nhập cân nặng đã"); return; }
    S.bw = S.bw.filter(x => x.date !== date).concat([{ date, kg }]);
    S.profile.weight = kg; save(true); render(); toast("Đã ghi " + n1(kg) + " kg"); return;
  }
  if (el.dataset.delbw) { S.bw = S.bw.filter(x => x.date !== el.dataset.delbw); save(true); render(); return; }

  if (el.id === "addDay") { S.days.push({ id: uid(), name: "Buổi mới", exercises: [] }); save(true); render(); return; }
  if (el.dataset.delday) {
    const d = S.days.find(x => x.id === el.dataset.delday);
    if (S.days.length < 2) { toast("Phải còn ít nhất một buổi"); return; }
    if (d && confirm(`Xoá "${d.name}"?\nNhật ký cũ vẫn giữ nguyên.`)) {
      S.days = S.days.filter(x => x.id !== el.dataset.delday);
      if (curDay === el.dataset.delday) { curDay = S.days[0].id; exIdx = 0; }
      save(true); render();
    } return;
  }
  if (el.dataset.addex) {
    const d = S.days.find(x => x.id === el.dataset.addex);
    if (d) { d.exercises.push({ id: uid(), name: "Bài mới", sets: 3, reps: "8–10",
      unit: "kg", start: 20, step: 2.5, rest: 120, note: "" }); save(true); render(); }
    return;
  }
  if (el.dataset.delex) {
    const [dayId, exId] = el.dataset.delex.split("|");
    const d = S.days.find(x => x.id === dayId), ex = d && d.exercises.find(x => x.id === exId);
    if (ex && confirm(`Xoá bài "${ex.name}"?`)) {
      d.exercises = d.exercises.filter(x => x.id !== exId);
      if (exIdx >= d.exercises.length) exIdx = 0;
      save(true); render();
    } return;
  }

  if (el.id === "exportBtn") {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }));
    a.download = "so-sat-" + today() + ".json"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast("Đã xuất file"); return;
  }
  if (el.id === "importBtn") { $("#importFile").click(); return; }
  if (el.id === "resetBtn") {
    if (confirm("Khôi phục chương trình gốc?\nNhật ký và cân nặng vẫn được giữ.")) {
      const f = seed();
      S.days = f.days; curDay = S.days[0].id; exIdx = 0;
      save(true); render(); toast("Đã khôi phục");
    } return;
  }
});

const NUMFIELDS = ["age", "height", "weight", "goalWeight", "activity", "surplus", "proteinPerKg", "fatPerKg", "weeks"];
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id && el.id.startsWith("p-")) {
    const f = el.id.slice(2);
    S.profile[f] = NUMFIELDS.includes(f) ? (el.value === "" ? "" : +el.value) : el.value;
    save(); return;
  }
  if (el.dataset.dayname) {
    const d = S.days.find(x => x.id === el.dataset.dayname);
    if (d) { d.name = el.value; save(); renderTop(); } return;
  }
  if (el.dataset.ex) {
    const [dayId, exId, field] = el.dataset.ex.split("|");
    const d = S.days.find(x => x.id === dayId), ex = d && d.exercises.find(x => x.id === exId);
    if (!ex) return;
    ex[field] = ["sets", "start", "step", "rest"].includes(field) ? (+el.value || 0) : el.value;
    if (field === "sets" && ex.sets < 1) ex.sets = 1;
    save(); return;
  }
  if (el.id === "dateInput") {
    curDate = el.value || today(); curDay = autoDay(); exIdx = firstUnfinished(); editIdx = null; render();
  }
});

/* Vừa đủ (hoặc vừa thiếu) thông số → vẽ lại tab Tôi ở dạng tương ứng. */
let hadProfile = !!targets();
document.addEventListener("change", e => {
  if (tab === "me" && e.target.id && e.target.id.startsWith("p-") && !!targets() !== hadProfile) {
    hadProfile = !!targets(); render();
  }
});

document.addEventListener("change", e => {
  if (e.target.id !== "importFile") return;
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !d.profile || !Array.isArray(d.days) || !d.days.length) throw new Error("thiếu trường bắt buộc");
      S = migrate(d); curDay = autoDay(); exIdx = firstUnfinished(); hadProfile = !!targets();
      save(true); render(); toast("Đã nhập dữ liệu");
    } catch (err) { toast("File không đọc được: " + err.message); }
  };
  r.readAsText(f); e.target.value = "";
});

/* ---------------- khởi động ---------------- */
curDay = autoDay();
exIdx = firstUnfinished();
render();
</script>
</body>
</html>
