<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<meta name="description" content="Sổ tập tạ — ghi từng set, đếm giờ nghỉ, theo dõi cân nặng. Dữ liệu nằm trên máy bạn.">
<title>Sổ Sắt</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Sắt">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#0d1014; --surface:#171d22; --raised:#222a31; --line:#2e3841;
  --chalk:#eef0f3; --muted:#96a1ae; --dim:#68737f;
  --brass:#e0a233; --brass-ink:#17120a; --jade:#43c295; --rust:#cf5c43;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--chalk);
  font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{max-width:640px;margin:0 auto;
  padding:0 max(16px, env(safe-area-inset-left)) calc(90px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right))}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.small{font-size:14px} .tiny{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.stack{display:flex;flex-direction:column;gap:12px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row{display:flex;align-items:center;gap:10px}
h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;
  font-size:21px;font-weight:600;margin:28px 0 8px}
h2:first-child{margin-top:8px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--ground);
  padding:calc(12px + env(safe-area-inset-top)) 0 10px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.session{font-family:var(--display);font-size:23px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.session em{font-style:normal;color:var(--brass)}
.bar{height:5px;background:var(--raised);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brass);border-radius:99px;transition:width .25s}
.dots{display:flex;gap:7px;margin-top:11px;overflow-x:auto;padding-bottom:2px}
.dot{flex:none;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface);color:var(--dim);font-family:var(--display);font-size:17px;font-weight:600}
.dot.done{background:#1d3830;border-color:#27503f;color:var(--jade)}
.dot[aria-current=true]{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}

/* ---------- buttons ---------- */
button{font-family:inherit;font-size:16px;cursor:pointer;color:inherit}
.btn{background:var(--brass);color:var(--brass-ink);border:0;border-radius:13px;
  padding:17px 20px;font-weight:600;font-size:17px;min-height:60px;width:100%;
  font-family:var(--display);font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.btn:active{background:#c78e29}
.btn.jade{background:var(--jade);color:#08201a}
.ghost{background:transparent;border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;min-height:52px;font-weight:500}
.ghost:active{background:var(--raised)}
.ghost.sm{min-height:42px;padding:8px 14px;font-size:14px;border-radius:10px}
.ghost.danger{color:var(--rust);border-color:#4d2c25}
.iconbtn{background:transparent;border:1px solid var(--line);color:var(--muted);
  width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:20px;flex:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- hình minh hoạ ---------- */
.figpair{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0 4px}
.figf{margin:0}
.figf img{width:100%;height:auto;display:block;border-radius:10px;
  border:1px solid var(--line);background:var(--surface)}
.figf figcaption{font-family:var(--display);font-size:13px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--dim);text-align:center;margin-top:5px}
.exhead{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}

/* ---------- exercise ---------- */
.exname{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.08;
  letter-spacing:.01em;margin:2px 0 4px;text-wrap:balance}
.exrx{font-family:var(--display);font-size:18px;letter-spacing:.07em;text-transform:uppercase;color:var(--brass)}
.exrx .of{color:var(--dim)}
.alts{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:12px}
.alts .lab{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-right:2px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;
  padding:7px 13px;min-height:38px;font-size:14px;color:var(--muted)}
.chip:active{background:var(--raised)}
.chip[aria-pressed=true]{border-color:var(--brass);color:var(--brass)}
.prev{font-size:14px;color:var(--muted);background:var(--surface);border-left:3px solid var(--brass);
  border-radius:10px;padding:10px 13px;margin:14px 0}
.prev b{color:var(--chalk);font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.prev .rule{display:block;margin-top:5px;font-size:13px;color:var(--dim)}
.prev .up{display:block;margin-top:6px;color:var(--jade);font-weight:500}
.warm{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:11px 14px;margin-bottom:4px}
.warm .lab{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.warm .ws{font-family:var(--display);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.effort{text-align:center;color:var(--dim);font-size:13px;margin-top:10px}
details.note ul{margin:6px 0 0;padding-left:20px;font-size:14px;color:var(--muted);line-height:1.65}
details.note{margin-top:14px}
details.note summary{color:var(--muted);font-size:14px;cursor:pointer;list-style:none;padding:6px 0}
details.note summary::-webkit-details-marker{display:none}
details.note summary::before{content:"▸ ";color:var(--dim)}
details.note[open] summary::before{content:"▾ "}
details.note p{margin:4px 0 0;font-size:14px;color:var(--muted);line-height:1.5}

/* ---------- done sets ---------- */
.doneset{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;margin-bottom:8px;overflow:hidden}
.doneset.editing{border-color:var(--brass)}
.ds-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:transparent;
  border:0;padding:13px 6px 13px 15px;text-align:left;min-height:54px}
.ds-main .tick{color:var(--jade);font-size:18px;flex:none}
.ds-main .val{font-family:var(--display);font-size:21px;font-weight:600;
  font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
.ds-del{flex:none;width:52px;background:transparent;border:0;border-left:1px solid var(--line);
  color:var(--dim);font-size:23px;line-height:1}
.ds-del:active{background:var(--raised);color:var(--rust)}

/* ---------- stepper ---------- */
.setlabel{font-family:var(--display);font-size:17px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);text-align:center;margin:18px 0 10px}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stepper{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stepper .cap{text-align:center;color:var(--dim);font-size:12.5px;letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:8px}
.stepper .ctrl{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;align-items:center;gap:4px}
.stepper button{background:var(--raised);border:0;border-radius:11px;height:54px;
  font-size:26px;font-family:var(--display);font-weight:600;color:var(--chalk)}
.stepper button:active{background:#2d363f}
.stepper input{width:100%;min-width:0;background:transparent;border:0;color:var(--chalk);text-align:center;
  font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;
  padding:0 2px;min-height:54px;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* ---------- rest timer ---------- */
.rest{background:var(--surface);border:1px solid var(--brass);border-radius:14px;padding:18px;text-align:center}
.rest .lab{font-family:var(--display);font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.rest .clock{font-family:var(--display);font-size:56px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}

/* ---------- generic form ---------- */
input,select,textarea{font-family:var(--body);font-size:16px;background:var(--ground);color:var(--chalk);
  border:1px solid var(--line);border-radius:11px;padding:13px 13px;width:100%;min-height:52px}
input[type=number]{font-family:var(--display);font-size:21px;font-weight:600;text-align:center;
  font-variant-numeric:tabular-nums;padding:10px 6px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
label.f{display:block}
label.f>span{display:block;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.badge{font-family:var(--display);font-size:13px;letter-spacing:.06em;padding:3px 9px;
  border-radius:6px;background:var(--raised);color:var(--muted)}
.badge.up{background:#1d3830;color:var(--jade)} .badge.down{background:#3a251f;color:var(--rust)}
details.sec{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
details.sec>summary{padding:17px 16px;font-family:var(--display);font-size:20px;font-weight:600;
  text-transform:uppercase;letter-spacing:.05em;cursor:pointer;list-style:none;display:flex;
  justify-content:space-between;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";color:var(--brass);font-size:26px;line-height:1}
details.sec[open]>summary::after{content:"–"}
details.sec>.body{padding:0 16px 16px;border-top:1px solid var(--line)}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,16,20,.97);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tab{background:transparent;border:0;color:var(--dim);padding:8px 2px 6px;border-radius:11px;
  display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px}
.tab .ico{font-size:21px;line-height:1}
.tab .lb{font-family:var(--display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.tab[aria-current=page]{color:var(--brass);background:var(--surface)}
.empty{text-align:center;color:var(--dim);padding:44px 16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));
  background:var(--jade);color:#08201a;padding:13px 22px;border-radius:99px;font-weight:600;
  z-index:50;opacity:0;pointer-events:none;transition:opacity .18s;white-space:nowrap}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar"></div>
  <main id="view"></main>
</div>
<nav>
  <button class="tab" data-tab="train"><span class="ico">🏋</span><span class="lb">Tập</span></button>
  <button class="tab" data-tab="history"><span class="ico">📓</span><span class="lb">Nhật ký</span></button>
  <button class="tab" data-tab="me"><span class="ico">⚖</span><span class="lb">Tôi</span></button>
</nav>
<div class="toast" id="toast"></div>
<script>
"use strict";
const KEY = "soSat.v2";
const uid = () => Math.random().toString(36).slice(2, 9);
const today = () => new Date().toISOString().slice(0, 10);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n1 = v => Math.round(v * 10) / 10;
const fmtDate = s => { const [, m, d] = s.split("-"); return d + "/" + m; };
const mmss = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

/* ---------------- hình minh hoạ động tác ----------------
   Hình que nhìn ngang, mặt hướng sang phải. Toạ độ trong khung 100×100, sàn y=94.
   h đầu · s vai · e khuỷu · w cổ tay · p hông · k gối · a cổ chân
   (k2/a2 là chân sau khi bài cần hai chân riêng).
   Tư thế mờ = điểm bắt đầu, đậm = điểm kết thúc.                        */
/* ---------------- hình minh hoạ động tác ----------------
   Ảnh từ free-exercise-db (yuhonas/free-exercise-db, giấy phép Unlicense —
   phạm vi công cộng). Mỗi bài hai khung: tư thế bắt đầu và tư thế kết thúc.
   Ảnh nằm trong img/ nên xem được cả khi mất mạng.                        */
const FIGLABEL = { squat: "Squat (đòn trên vai)", bench: "Đẩy ngực nằm", pullup: "Kéo xà",
  rdl: "Romanian deadlift", facepull: "Face pull (cáp)", legraise: "Treo nâng chân",
  deadlift: "Deadlift từ sàn", ohp: "Đẩy vai qua đầu", row: "Kéo tạ khom người",
  bss: "Squat một chân, chân sau gác", lateral: "Nâng tạ ngang vai", curl: "Cuốn tay trước",
  legpress: "Đạp đùi (máy)", pushdown: "Đẩy tay sau (cáp)",
  incline: "Đẩy ngực ghế dốc", dbcurl: "Cuốn tạ tay", calf: "Nhón bắp chân" };

function figureHTML(key) {
  if (!key || !FIGLABEL[key]) return "";
  const lab = esc(FIGLABEL[key]);
  return `<div class="figpair">` + [0, 1].map(i =>
    `<figure class="figf">
       <img src="./img/${key}-${i}.jpg" width="400" height="267" loading="lazy" decoding="async"
            alt="${lab} — tư thế ${i ? "kết thúc" : "bắt đầu"}">
       <figcaption>${i ? "Kết thúc" : "Bắt đầu"}</figcaption>
     </figure>`).join("") + `</div>`;
}

/* ---------------- dữ liệu khởi tạo ---------------- */
/** Tên bài mặc định → khoá hình minh hoạ trong FIGLABEL. */
const FIGKEY = {
  "Back Squat": "squat", "Bench Press": "bench", "Xà đeo tạ": "pullup",
  "Romanian Deadlift": "rdl", "Face Pull": "facepull", "Hanging Leg Raise": "legraise",
  "Deadlift": "deadlift", "Overhead Press": "ohp", "Barbell Row": "row",
  "Bulgarian Split Squat": "bss", "Lateral Raise": "lateral", "Hammer Curl": "curl",
  "Leg Press": "legpress", "Triceps Pushdown": "pushdown",
  "Incline Dumbbell Press": "incline", "Dumbbell Curl": "dbcurl", "Calf Raise": "calf",
};
/** Bài thay thế khi máy bận, theo tên bài chính. Khởi điểm chỉ là ước lượng từ mức bài chính. */
const alt = (id, name, reps, unit, start, step, note, fig) =>
  ({ id, name, reps, unit, start, step, note, fig: fig || "" });
const ALTS = {
  "Back Squat": [
    alt("goblet", "Goblet Squat", "8–12", "kg", 16, 2, "Ôm một quả tạ tay dựng đứng trước ngực, khuỷu chỉ xuống giữa hai gối. Không cần rack."),
    alt("smith-squat", "Smith Squat", "6–8", "kg", 30, 2.5, "Tạ trên Smith không so được với tạ đòn (có ray đỡ, đòn máy nhẹ hơn) nên ghi riêng. Chân đặt hơi lên trước thanh đòn.", "squat"),
  ],
  "Bench Press": [
    alt("db-bench", "Đẩy ngực tạ tay", "8–10", "kg/tay", 20, 2, "Hạ tạ tới ngang ngực, khuỷu chếch khoảng 45° so với thân. Chỉ cần một ghế phẳng."),
    alt("chest-press", "Chest Press máy", "8–10", "kg", 35, 5, "Tay cầm ngang giữa ngực, siết bả vai ra sau trước khi đẩy."),
  ],
  "Xà đeo tạ": [
    alt("pulldown", "Lat Pulldown", "8–10", "kg", 45, 5, "Kéo thanh về sát ngực trên, ngả người nhẹ, đừng giật bằng lưng."),
  ],
  "Romanian Deadlift": [
    alt("db-rdl", "RDL tạ tay", "8–10", "kg/tay", 16, 2, "Giống RDL đòn: đẩy hông ra sau, tạ trượt sát ống chân, dừng khi thấy căng đùi sau.", "rdl"),
    alt("leg-curl", "Leg Curl máy", "10–12", "kg", 25, 5, "Cuốn gót về phía mông, hạ chậm 2–3 giây."),
  ],
  "Leg Press": [
    alt("hack", "Hack Squat máy", "8–10", "kg", 40, 5, "Chỉ tính đĩa gắn thêm, không tính bàn trượt."),
    alt("lunge", "Lunge tạ tay", "10/chân", "kg/tay", 10, 2, "Bước dài vừa phải, gối sau hạ gần chạm sàn."),
  ],
  "Face Pull": [
    alt("rear-fly", "Bay vai sau tạ tay", "15", "kg/tay", 5, 1, "Cúi người gần song song sàn, dang tay sang hai bên, siết bả vai."),
    alt("reverse-pec", "Reverse Pec Deck", "15", "kg", 20, 5, "Ngồi quay mặt vào máy, tay duỗi gần thẳng, mở rộng ra sau."),
  ],
  "Hanging Leg Raise": [
    alt("captain", "Nâng chân ghế tựa", "10–15", "+kg", 0, 1, "Tì cẳng tay lên đệm, lưng áp tựa, nâng gối lên ngực."),
    alt("lying-raise", "Nằm nâng chân", "12–15", "+kg", 0, 1, "Nằm ngửa trên sàn, tay đặt dưới mông, lưng dưới ép sát sàn."),
  ],
  "Deadlift": [
    alt("trapbar", "Trap Bar Deadlift", "5", "kg", 55, 5, "Đứng giữa khung, tay cầm hai bên, đẩy sàn bằng chân."),
    alt("db-deadlift", "Deadlift tạ tay", "8", "kg/tay", 22, 2, "Tạ hai bên chân, lưng thẳng, hạ tới giữa ống chân."),
  ],
  "Overhead Press": [
    alt("db-ohp", "Đẩy vai tạ tay", "8–10", "kg/tay", 12, 2, "Ngồi ghế có tựa hoặc đứng, siết bụng, đẩy tạ lên thẳng trên đầu."),
    alt("shoulder-press", "Shoulder Press máy", "8–10", "kg", 25, 5, "Tay cầm ngang vai ở điểm thấp nhất."),
  ],
  "Barbell Row": [
    alt("db-row", "Row tạ tay một tay", "8–10/tay", "kg", 22, 2, "Một gối và một tay tì ghế, kéo tạ về phía hông."),
    alt("cable-row", "Kéo cáp ngồi", "10–12", "kg", 40, 5, "Ngồi thẳng lưng, kéo tay cầm về rốn, siết bả vai."),
  ],
  "Bulgarian Split Squat": [
    alt("rev-lunge", "Lunge lùi tạ tay", "8–10/chân", "kg/tay", 10, 1, "Bước lùi thay vì tiến — đỡ áp lực lên gối trước."),

const altsFor = name => (ALTS[name] || []).map(a => ({ ...a }));

/* ---------------- lưu trữ ---------------- */
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || "null");
    // migrate cả dữ liệu v2 đã lưu: chỉ điền trường còn thiếu nên chạy lại vô hại
    if (d && d.profile && Array.isArray(d.days) && d.days.length) return refresh(migrate(d));
    const old = JSON.parse(localStorage.getItem("soSat.v1") || "null");
    if (old && old.profile && Array.isArray(old.days)) return migrate(old);
  } catch (e) { /* dữ liệu hỏng hoặc trình duyệt chặn — dùng bản mặc định */ }
  return seed();
}
/** v1 chưa có start/step/rest — lấy từ bản mặc định theo tên bài. */
function migrate(old) {
  const base = seed(), byName = {};
  base.days.forEach(d => d.exercises.forEach(e => { byName[e.name] = e; }));
  old.days.forEach(d => d.exercises.forEach(e => {
    const b = byName[e.name] || {};
    if (e.start == null) e.start = b.start != null ? b.start : 0;
    if (e.step == null) e.step = b.step || 2.5;
    if (e.rest == null) e.rest = b.rest || 120;
    if (e.fig == null) e.fig = FIGKEY[e.name] || "";
    if (e.alts == null) e.alts = altsFor(e.name);
    if (e.warm == null) e.warm = WARM.includes(e.name);
  }));
  if (!old.swap) old.swap = {};
  return old;
}
/** Chương trình mặc định có bản mới: thay vào nếu người dùng chưa ghi buổi nào
 *  (đã tập rồi thì chỉ chèn bài mới vào đúng chỗ — bài cũ, mức tạ, nhật ký giữ nguyên). */
function refresh(d) {
  if (d.progVersion >= PROG_VERSION) return d;
  const daGhi = Object.keys(d.log || {}).some(k => (d.log[k] || []).length);
  if (!daGhi) d.days = seed().days;
  else addNewExercises(d);
  d.progVersion = PROG_VERSION;
  return d;
}
function addNewExercises(d) {
  seed().days.forEach(b => {
    const u = d.days.find(x => x.exercises.some(e => e.name === b.exercises[0].name));
    if (!u) return;
    b.exercises.forEach((e, i) => {
      if (u.exercises.some(x => x.name === e.name)) return;
      const prev = i ? u.exercises.findIndex(x => x.name === b.exercises[i - 1].name) : -1;
      u.exercises.splice(prev >= 0 ? prev + 1 : u.exercises.length, 0, e);
    });
  });
}
let saveTimer = null;
function save(now) {
  clearTimeout(saveTimer);
  const w = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); }
                    catch (e) { toast("Không lưu được — bộ nhớ bị chặn"); } };
  now ? w() : (saveTimer = setTimeout(w, 300));
}

/* ---------------- trạng thái ---------------- */
let S = load();
let tab = "train";
let curDate = today();
let curDay = null;
let exIdx = 0;
let editIdx = null;
let restEnd = 0, restTimer = null;
let showPicker = false;

let toastTimer = null;
function toast(m) {
  const t = $("#toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ---------------- tính toán ---------------- */
function targets() {
  const p = S.profile, w = +p.weight, h = +p.height, a = +p.age;
  if (!(w > 0 && h > 0 && a > 0)) return null;
  const bmr = 10 * w + 6.25 * h - 5 * a + (p.sex === "m" ? 5 : -161);
  const tdee = bmr * (+p.activity || 1.5);
  const kcal = tdee + (+p.surplus || 0);
  const protein = w * (+p.proteinPerKg || 2);
  const fat = w * (+p.fatPerKg || 1);
  return { bmr, tdee, kcal, protein, fat, carb: Math.max(0, (kcal - protein * 4 - fat * 9) / 4) };
}
function weekNo(d) {
  const s = new Date(S.profile.startDate + "T00:00:00"), x = new Date(d + "T00:00:00");
  if (isNaN(s) || isNaN(x)) return 1;
  return Math.max(1, Math.floor((x - s) / 604800000) + 1);
}
const lkey = (date, dayId, exId) => date + "|" + dayId + "|" + exId;
const sets = (date, dayId, exId) => S.log[lkey(date, dayId, exId)] || [];
const day = () => S.days.find(d => d.id === curDay) || S.days[0];

function sessionDates() {
  const s = new Set();
  for (const k in S.log) if ((S.log[k] || []).length) s.add(k.split("|")[0]);
  return [...s].sort().reverse();
}
function dayOfDate(date) {
  for (const d of S.days) for (const e of d.exercises)
    if (sets(date, d.id, e.id).length) return d.id;
  return null;
}
/** Buổi hôm nay nếu đã ghi; nếu chưa thì buổi kế tiếp sau buổi gần nhất. */
function autoDay() {
  const t = dayOfDate(curDate); if (t) return t;
  for (const dt of sessionDates()) {
    const d = dayOfDate(dt);
    if (d) { const i = S.days.findIndex(x => x.id === d); return S.days[(i + 1) % S.days.length].id; }
  }
  return S.days[0].id;
}
/** Bài thay thế giữ id của ô bài chính (tiến độ, nhật ký tính như cũ) nhưng có tên, tạ, lịch sử riêng. */
function eff(ex, date, dayId) {
  const altId = S.swap[lkey(date, dayId, ex.id)] || "";
  if (!altId) return { ...ex, altId: "", altOf: "" };
  const a = (ex.alts || []).find(x => x.id === altId);
  if (!a) return { ...ex, name: ex.name + " (bài thay đã xoá)", note: "", fig: "", altId, altOf: ex.name };
  return { ...ex, name: a.name, reps: a.reps || ex.reps, unit: a.unit || ex.unit,
    start: +a.start || 0, step: +a.step || ex.step, note: a.note || "", fig: a.fig || "",
    altId, altOf: ex.name };
}
function lastPerf(exId, altId) {
  let best = null;
  for (const k in S.log) {
    const [d, , e] = k.split("|");
    if (e !== exId || d >= curDate || !(S.log[k] || []).length) continue;
    if ((S.swap[k] || "") !== (altId || "")) continue;
    if (!best || d > best.date) best = { date: d, sets: S.log[k] };
  }
  return best;
}
const repLow = r => { const m = String(r).match(/\d+/); return m ? +m[0] : 8; };
const repHigh = r => { const m = String(r).match(/\d+/g); return m ? +m[m.length - 1] : 10; };
/** Không có lịch sử ở ô này thì lấy bài cùng tên ở buổi khác (Lateral Raise nằm ở cả A và B). */
function perf(ex) {
  const own = lastPerf(ex.id, ex.altId);
  if (own) return own;
  let best = null;
  for (const k in S.log) {
    const [d, dayId, exId] = k.split("|");
    if (d >= curDate || exId === ex.id || !(S.log[k] || []).length || (best && d <= best.date)) continue;
    const dd = S.days.find(x => x.id === dayId), e = dd && dd.exercises.find(x => x.id === exId);
    if (e && eff(e, d, dayId).name === ex.name) best = { date: d, sets: S.log[k] };
  }
  return best;
}
function levelUp(ex, p) {
  if (!p || !(+ex.step > 0) || p.sets.length < ex.sets) return null;
  if (!p.sets.every(s => +s.reps >= repHigh(ex.reps))) return null;
  return n1(Math.max(...p.sets.map(s => +s.kg || 0)) + +ex.step);
}
function warmups(work, name) {
  const r = x => Math.round(x / 2.5) * 2.5, dl = name === "Deadlift", out = [];
  [[dl ? 0 : 20, 10], [r(work * .5), dl ? 8 : 5], [r(work * .7), 3], [r(work * .85), 2]].forEach(([kg, reps]) => {
    if (kg >= 20 && kg <= work - 5 && (!out.length || kg >= out[out.length - 1].kg + 5)) out.push({ kg, reps });
  });
  return out;
}
/** Gợi ý tạ/rep: set trước trong buổi → cùng set buổi trước → mức khởi điểm. */
function suggest(ex, i) {
  const cur = sets(curDate, curDay, ex.id);
  if (i > 0 && cur[i - 1]) return { kg: cur[i - 1].kg, reps: cur[i - 1].reps };
  const p = perf(ex), up = levelUp(ex, p);
  if (up != null) return { kg: up, reps: repLow(ex.reps) };
  if (p) { const s = p.sets[Math.min(i, p.sets.length - 1)]; return { kg: s.kg, reps: s.reps }; }
  return { kg: ex.start != null ? ex.start : 0, reps: repLow(ex.reps) };
}
function progress() {
  const d = day(); let done = 0, total = 0;
  d.exercises.forEach(e => { done += Math.min(sets(curDate, d.id, e.id).length, e.sets); total += +e.sets || 0; });
  return { done, total, pct: total ? Math.round(done / total * 100) : 0 };
}
function volume(date) {
  let v = 0;
  for (const k in S.log) if (k.startsWith(date + "|"))
    (S.log[k] || []).forEach(s => { v += (+s.kg || 0) * (+s.reps || 0); });
  return v;
}

/* ---------------- thanh trên cùng ---------------- */
/** "Buổi A" -> Buổi <em>A</em>; escape từng phần rồi mới ghép thẻ. */
function hiName(name) {
  const w = String(name).trim().split(/\s+/);
  return w.length > 1
    ? esc(w.slice(0, -1).join(" ")) + " <em>" + esc(w[w.length - 1]) + "</em>"
    : "<em>" + esc(name) + "</em>";
}
function renderTop() {
  const el = $("#topbar");
  if (tab !== "train") {
    el.innerHTML = `<div class="topline"><div class="session">${tab === "history" ? "Nhật <em>ký</em>" : "Hồ <em>sơ</em>"}</div></div>`;
    return;
  }
  const d = day(), pr = progress();
  const dots = d.exercises.map((e, i) => {
    const n = sets(curDate, d.id, e.id).length;
    return `<button class="dot ${n >= e.sets ? "done" : ""}" data-jump="${i}"
      aria-current="${i === exIdx}" aria-label="${esc(eff(e, curDate, d.id).name)}">${n >= e.sets ? "✓" : i + 1}</button>`;
  }).join("");
  el.innerHTML = `
    <div class="topline">
      <div>
        <div class="session">${hiName(d.name)}</div>
        <div class="small muted" style="margin-top:-2px">Tuần ${weekNo(curDate)} · ${fmtDate(curDate)} · ${pr.done}/${pr.total} set</div>
      </div>
      <button class="iconbtn" id="pickerBtn" aria-label="Đổi ngày hoặc buổi tập">${showPicker ? "×" : "⋯"}</button>
    </div>
    <div class="bar"><i style="width:${pr.pct}%"></i></div>
    <div class="dots">${dots}</div>`;
}

/* ---------------- TẬP ---------------- */
function viewTrain() {
  const d = day();
  if (!d.exercises.length) return `<div class="empty">Buổi này chưa có bài nào.<br><br>
    <button class="ghost" data-goto="me">Mở Hồ sơ → Chương trình</button></div>`;
  if (exIdx >= d.exercises.length) exIdx = 0;
  const slot = d.exercises[exIdx], ex = eff(slot, curDate, d.id);
  const done = sets(curDate, d.id, ex.id);
  const total = +ex.sets || 1;
  const idx = editIdx != null ? editIdx : done.length;
  const finished = done.length >= total && editIdx == null;

  let picker = "";
  if (showPicker) {
    picker = `<div class="card stack" style="margin-bottom:16px">
      <label class="f"><span>Ngày tập</span><input type="date" id="dateInput" value="${curDate}"></label>
      <div><span class="tiny muted" style="display:block;margin-bottom:8px">Buổi tập</span>
        <div class="pair">${S.days.map(x =>
          `<button class="ghost" data-day="${x.id}"
            style="${x.id === curDay ? "border-color:var(--brass);color:var(--brass)" : ""}">${esc(x.name)}</button>`).join("")}</div></div>
    </div>`;
  }

  const p = perf(ex), up = levelUp(ex, p), unit = String(ex.unit).replace(/^\+/, "");
  const prev = p
    ? `<div class="prev">Lần trước · ${fmtDate(p.date)} — ` +
      p.sets.map(s => `<b>${esc(s.kg)}</b>×<b>${esc(s.reps)}</b>`).join(" &nbsp; ") +
      (up != null
        ? `<span class="up">↑ Đủ rep ở mọi set — hôm nay lên ${esc(up)} ${esc(unit)}</span>`
        : `<span class="rule">Đủ ${repHigh(ex.reps)} rep ở cả ${total} set thì buổi sau app tự tăng ${esc(ex.step)} ${esc(unit)}.</span>`) +
      `</div>`
    : ex.altId
      ? `<div class="prev dim">Chưa tập bài này — mức gợi ý chỉ là ước lượng, set đầu làm nhẹ để dò.</div>`
      : `<div class="prev dim">Chưa có buổi trước — số bạn ghi hôm nay là mốc gốc.</div>`;

  const alts = (slot.alts || []).length
    ? `<div class="alts" role="group" aria-label="Máy bận thì đổi bài"><span class="lab">Máy bận?</span>` +
      [{ id: "", name: slot.name }].concat(slot.alts).map(a =>
        `<button class="chip" data-alt="${esc(a.id)}" aria-pressed="${a.id === ex.altId}">${esc(a.name)}</button>`).join("") +
      `</div>`
    : "";

  const doneList = done.map((s, i) => `
    <div class="doneset ${editIdx === i ? "editing" : ""}">
      <button class="ds-main" data-edit="${i}">
        <span class="tick">✓</span><span class="muted">Set ${i + 1}</span>
        <span class="val">${esc(s.kg)} <span style="color:var(--dim)">×</span> ${esc(s.reps)}</span>
      </button>
      <button class="ds-del" data-delset="${i}" aria-label="Xoá set ${i + 1}">×</button>
    </div>`).join("");

  /* --- khu vực hành động --- */
  let action = "";
  const resting = restEnd > Date.now();

  if (resting) {
    action = `<div class="rest">
      <div class="lab">Nghỉ</div>
      <div class="clock" id="restNum">${mmss(Math.ceil((restEnd - Date.now()) / 1000))}</div>
      <div class="pair" style="margin-top:14px">
        <button class="ghost" id="restAdd">+30 giây</button>
        <button class="ghost" id="restSkip">Bỏ qua</button>
      </div></div>`;
  } else if (finished) {
    const next = exIdx + 1 < d.exercises.length ? d.exercises[exIdx + 1] : null;
    const pr = progress();
    action = next
      ? `<button class="btn jade" data-jump="${exIdx + 1}">Bài tiếp · ${esc(next.name)}</button>`
      : pr.done >= pr.total
        ? `<div class="card" style="text-align:center;border-color:var(--jade)">
            <div class="num" style="font-size:38px;color:var(--jade)">Xong buổi</div>
            <div class="muted small" style="margin-bottom:12px">Tổng khối lượng
              <b class="num" style="color:var(--chalk);font-size:19px">${Math.round(volume(curDate)).toLocaleString("vi-VN")}</b> kg</div>
            <button class="ghost" data-goto="history">Xem nhật ký</button></div>`
        : `<button class="btn" data-jump="0">Quay lại bài chưa xong</button>`;
  } else {
    const sg = editIdx != null ? done[editIdx] : suggest(ex, idx);
    const wu = ex.warm && !ex.altId && !done.length && editIdx == null ? warmups(+sg.kg, ex.name) : [];
    action = (wu.length ? `
      <div class="warm"><div class="lab">Khởi động · nghỉ ~1 phút · không ghi</div>
        <div class="ws">${wu.map(w => `${w.kg}×${w.reps}`).join(" &nbsp;·&nbsp; ")}</div></div>` : "") + `
      <div class="setlabel">${editIdx != null ? "Sửa set " + (editIdx + 1) : "Set " + (idx + 1) + " / " + total}</div>
      <div class="steppers">
        <div class="stepper"><div class="cap">${esc(ex.unit)}</div>
          <div class="ctrl">
            <button data-step="kg:-1" aria-label="Giảm tạ">−</button>
            <input id="kgVal" type="number" inputmode="decimal" step="${ex.step || 2.5}" value="${esc(sg.kg)}" aria-label="Mức tạ">
            <button data-step="kg:1" aria-label="Tăng tạ">+</button>
          </div></div>
        <div class="stepper"><div class="cap">rep · mục tiêu ${esc(ex.reps)}</div>
          <div class="ctrl">
            <button data-step="reps:-1" aria-label="Giảm rep">−</button>
            <input id="repVal" type="number" inputmode="numeric" step="1" value="${esc(sg.reps)}" aria-label="Số rep">
            <button data-step="reps:1" aria-label="Tăng rep">+</button>
          </div></div>
      </div>
      <button class="btn" id="logSet" style="margin-top:14px">
        ${editIdx != null ? "Cập nhật set " + (editIdx + 1) : "✓ Xong set " + (idx + 1)}</button>
      ${editIdx == null && idx === 0 ? `<div class="effort">Mỗi set dừng khi còn 1–3 rep nữa là hết sức, không để gãy form</div>` : ""}
      ${editIdx != null ? `<button class="ghost" id="cancelEdit" style="margin-top:10px;width:100%">Huỷ</button>` : ""}`;
  }

  const general = exIdx === 0 && !progress().done ? `<details class="note" style="margin:0 0 12px">
      <summary>Khởi động chung · 8–10 phút trước bài đầu</summary>
      <ul><li>Đạp xe hoặc đi bộ dốc 4–5 phút, tới khi hơi ra mồ hôi</li>
        <li>Vung chân trước–sau rồi sang ngang · 10 mỗi chân</li>
        <li>World's greatest stretch · 5 mỗi bên</li>
        <li>Cat–camel · 8 lần</li>
        <li>Glute bridge · 12 lần</li>
        <li>Squat không tạ, giữ dưới 2 giây · 10 lần</li>
        <li>Xoay tay vòng lớn, dang tay siết bả vai · 15 lần</li></ul>
      <p>Không kéo giãn giữ lâu trước khi tập nặng — để dành cho sau buổi.</p></details>` : "";

  return `${picker}${general}
    <div class="exname">${esc(ex.name)}</div>
    <div class="exrx">${total} set × ${esc(ex.reps)} rep${ex.altOf ? ` <span class="of">· thay ${esc(ex.altOf)}</span>` : ""}</div>
    ${alts}
    ${prev}
    ${doneList}
    ${action}
    ${(ex.fig || ex.note) ? `<details class="note"${p ? "" : " open"}>
      <summary>Cách tập${p ? "" : " · mở sẵn vì bạn chưa tập bài này"}</summary>
      ${figureHTML(ex.fig)}${ex.note ? `<p>${esc(ex.note)}</p>` : ""}</details>` : ""}
    <div class="pair" style="margin-top:22px">
      <button class="ghost" data-jump="${exIdx - 1}"${exIdx === 0 ? ' disabled style="opacity:.35"' : ""}>‹ Bài trước</button>
      <button class="ghost" data-jump="${exIdx + 1}"${exIdx >= d.exercises.length - 1 ? ' disabled style="opacity:.35"' : ""}>Bài sau ›</button>
    </div>`;
}

function viewHistory() {
  const dates = sessionDates();
  if (!dates.length) return `<div class="empty">Chưa ghi buổi nào.<br>Sang tab Tập và bấm xong set đầu tiên.</div>`;
  return `<div class="sub">${dates.length} buổi. Khối lượng = tạ × rep cộng dồn — con số này tăng đều nghĩa là bạn đang tiến bộ.</div>
  <div class="stack">` + dates.map(date => {
    const dId = dayOfDate(date), d = S.days.find(x => x.id === dId);
    const rows = !d ? "" : d.exercises.map(e => {
      const s = sets(date, d.id, e.id);
      return s.length ? `<div class="lrow"><div>${esc(eff(e, date, d.id).name)}</div>
        <div class="num muted">${s.map(x => `${esc(x.kg)}×${esc(x.reps)}`).join("  ")}</div></div>` : "";
    }).join("");
    return `<div class="card">
      <div class="spread" style="margin-bottom:8px">
        <div><div class="num" style="font-size:22px">${fmtDate(date)} · ${esc(d ? d.name : "?")}</div>
          <div class="small dim">Tuần ${weekNo(date)}</div></div>
        <div style="text-align:right"><div class="num" style="font-size:22px;color:var(--brass)">${Math.round(volume(date)).toLocaleString("vi-VN")}</div>
          <div class="small dim">kg</div></div>
      </div>${rows}</div>`;
  }).join("") + `</div>`;
}

/* ---------------- cài lên màn hình chính ---------------- */
const isStandalone = () =>
  matchMedia("(display-mode: standalone)").matches ||
  matchMedia("(display-mode: fullscreen)").matches ||
  navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let installPrompt = null;

function installCard() {
  if (isStandalone()) return "";
  const how = installPrompt
    ? `<button class="btn" id="installBtn" style="margin-top:14px">Cài lên màn hình chính</button>`
    : isIOS()
      ? `<p class="small muted" style="margin:12px 0 0">Bấm nút <b>Chia sẻ</b> ở thanh dưới Safari →
         <b>Thêm vào MH chính</b>. Mở từ icon sẽ chạy toàn màn hình, không còn thanh địa chỉ.</p>`
      : `<p class="small muted" style="margin:12px 0 0">Mở menu ⋮ của trình duyệt →
         <b>Thêm vào màn hình chính</b> (hoặc <b>Cài ứng dụng</b>).</p>`;
  return `<div class="card" style="border-color:#8a6320">
    <div class="row" style="align-items:flex-start">
      <img src="./favicon.svg" alt="" width="46" height="46" style="border-radius:12px;flex:none">

        <div class="num" style="font-size:20px">Cài như một app</div>
        <div class="small muted">Chạy toàn màn hình, có icon riêng, và dùng được cả khi mất mạng.</div>

}

/* ---------------- TÔI ---------------- */
/** Nhịp tăng cân từ lần cân mới nhất so với lần cân cách đó 1–3 tuần (bw xếp mới → cũ). */
function gainPace(bw) {
  const last = bw[0], gap = e => (new Date(last.date) - new Date(e.date)) / 864e5;
  const base = last && bw.filter(e => gap(e) >= 7 && gap(e) <= 21).pop();
  if (!base) return `<p class="small muted" style="margin:14px 0 0">Cân 1–2 lần mỗi tuần. Có số liệu cách nhau từ 1 tuần, app sẽ cho biết có cần ăn thêm không.</p>`;
  const rate = n1((last.kg - base.kg) / gap(base) * 7);
  const [color, msg] = rate < 0.1 ? ["var(--rust)", "Chậm quá — thêm 200–300 kcal mỗi ngày (một cốc sữa hoặc Ensure)."]
    : rate > 0.6 ? ["var(--brass)", "Hơi nhanh, dễ tích mỡ — bớt 150–200 kcal mỗi ngày."]
    : ["var(--jade)", "Đúng nhịp — giữ nguyên cách ăn."];
  return `<div class="card" style="margin-top:14px;border-color:${color}">
    <div class="num" style="font-size:22px;color:${color}">${rate > 0 ? "+" : ""}${rate} kg/tuần</div>
    <div class="small muted">${msg} Mục tiêu 0.25–0.5 kg/tuần.</div></div>`;
}
function altEditor(d, e) {
  const f = (a, field) => `data-altf="${d.id}|${e.id}|${esc(a.id)}|${field}"`;
  return `<div class="tiny muted" style="margin:14px 0 8px">Bài thay thế khi máy bận</div>` +
    (e.alts || []).map(a => `
      <div style="border-left:2px solid var(--line);padding-left:10px;margin-bottom:12px">
        <div class="row" style="margin-bottom:8px">
          <input value="${esc(a.name)}" ${f(a, "name")} aria-label="Tên bài thay thế">
          <button class="iconbtn" style="color:var(--rust);border-color:#4d2c25" data-delalt="${d.id}|${e.id}|${esc(a.id)}" aria-label="Xoá bài thay thế">×</button>
        </div>
        <div class="g2" style="margin-bottom:8px">
          <label class="f"><span>Rep</span><input value="${esc(a.reps)}" ${f(a, "reps")} style="font-family:var(--display);font-size:21px;text-align:center;padding:10px 4px"></label>
          <label class="f"><span>Đơn vị</span><input value="${esc(a.unit)}" ${f(a, "unit")} style="font-size:14px;text-align:center;padding:14px 4px"></label>
        </div>
        <div class="g2">
          <label class="f"><span>Khởi điểm</span><input type="number" step="0.5" inputmode="decimal" value="${esc(a.start)}" ${f(a, "start")}></label>
          <label class="f"><span>Bước ±</span><input type="number" step="0.5" inputmode="decimal" value="${esc(a.step)}" ${f(a, "step")}></label>
        </div>
      </div>`).join("") +
    `<button class="ghost sm" data-addalt="${d.id}|${e.id}">+ Bài thay thế</button>`;
}

        <label class="f"><span>Béo g/kg</span><input type="number" step="0.1" inputmode="decimal" id="p-fatPerKg" value="${esc(p.fatPerKg)}"></label>
      </div>

        <label class="f"><span>Số tuần</span><input type="number" inputmode="numeric" id="p-weeks" value="${esc(p.weeks)}"></label>
      </div>
    </div>`;

  if (!t) return `
    <h2>Thiết lập</h2>

    <div class="card">${profileForm}</div>

        <button class="ghost" id="bwAdd" style="min-width:70px">Ghi</button>
      </div>
      ${gainPace(bw)}
      <p class="small dim" style="margin:12px 0 0">Cân buổi sáng, sau vệ sinh, trước khi ăn — cùng điều kiện mỗi lần.</p>
      ${bw.length ? `<div style="margin-top:8px">${rows}</div>` : ""}

    <details class="sec"><summary>Dinh dưỡng</summary><div class="body">
      <div class="g2" style="text-align:center;gap:16px;padding:16px 0">

        <div><div class="num" style="font-size:22px">${Math.round(t.fat)}<span style="font-size:14px"> g</span></div><div class="small dim">chất béo</div></div>
      </div>
      <p class="small muted" style="border-top:1px solid var(--line);padding-top:12px;margin:0 0 16px">

      <div class="lrow"><div><b>Trưa</b><div class="small muted">2 chén cơm + 150 g thịt/cá + rau</div></div><div class="num muted">~800</div></div>

      <div class="lrow"><div><b>Tối</b><div class="small muted">2 chén cơm + 100 g ức gà + 1 trứng + rau</div></div><div class="num muted">~750</div></div>
      <div class="lrow"><div><b>Trước ngủ</b><div class="small muted">1 scoop whey hoặc 250 ml sữa</div></div><div class="num muted">~150</div></div>
      <p class="small dim" style="margin:12px 0 0">≈ 2 750 kcal / 145 g đạm. Sữa và bơ đậu phộng là cách rẻ nhất để thêm calo mà không thấy no.</p>
    </div></details>

    <details class="sec"><summary>Thông số</summary><div class="body">${profileForm}</div></details>

    <details class="sec"><summary>Chương trình</summary><div class="body">
      <p class="small muted" style="margin:14px 0 0">Sửa gì cũng được, lưu ngay khi gõ. <b>Khởi điểm</b> là mức tạ gợi ý cho buổi đầu, <b>bước ±</b> là mức tăng giảm mỗi lần bấm nút.</p>
      ${program}
      <button class="ghost" id="addDay" style="margin-top:16px;width:100%">+ Thêm buổi tập</button>
    </div></details>

    <details class="sec"><summary>Dữ liệu</summary><div class="body">
      <p class="small muted" style="margin:14px 0">Mọi thứ nằm trong trình duyệt máy này. Xoá dữ liệu duyệt web là mất — xuất file định kỳ.</p>
      <div class="stack">
        <button class="ghost" id="exportBtn">⬇ Xuất file JSON</button>
        <button class="ghost" id="importBtn">⬆ Nhập từ file JSON</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
        <button class="ghost danger" id="resetBtn">Khôi phục chương trình gốc</button>
      </div>
    </div></details>
  </div>`;
}

/* ---------------- render ---------------- */
let lastTab = null;
function render() {
  if (!curDay || !S.days.some(d => d.id === curDay)) curDay = autoDay();
  renderTop();
  // vẽ lại tab Tôi (thêm bài, thêm bài thay thế…) không được gập mục người dùng đang mở
  const wasOpen = tab === "me" && lastTab === "me"
    ? [...document.querySelectorAll("#view details")].map(x => x.open) : null;
  $("#view").innerHTML = tab === "train" ? viewTrain() : tab === "history" ? viewHistory() : viewMe();
  if (wasOpen) document.querySelectorAll("#view details").forEach((x, i) => { if (i < wasOpen.length) x.open = wasOpen[i]; });
  lastTab = tab;
  document.querySelectorAll(".tab").forEach(b =>
    b.dataset.tab === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
}

/* ---------------- đồng hồ nghỉ ---------------- */
let audioCtx = null;
function ensureAudio() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume(); } catch (e) { /* không có audio */ }
}
function buzz() {
  try { if (navigator.vibrate) navigator.vibrate([220, 90, 220]); } catch (e) {}
  try {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t0 = audioCtx.currentTime;
    o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
    o.start(t0); o.stop(t0 + 0.6);
  } catch (e) { /* trình duyệt chặn âm thanh */ }
}
function startRest(sec) {
  if (!sec || sec <= 0) { render(); return; }
  restEnd = Date.now() + sec * 1000;
  render();
  clearInterval(restTimer);
  restTimer = setInterval(() => {
    const left = Math.ceil((restEnd - Date.now()) / 1000);
    if (left <= 0) { clearInterval(restTimer); restTimer = null; restEnd = 0; buzz(); render(); return; }
    const el = $("#restNum"); if (el) el.textContent = mmss(left);
  }, 250);
}
function stopRest() { clearInterval(restTimer); restTimer = null; restEnd = 0; render(); }

function firstUnfinished() {
  const d = day();
  for (let i = 0; i < d.exercises.length; i++)
    if (sets(curDate, d.id, d.exercises[i].id).length < d.exercises[i].sets) return i;
  return 0;
}

/* ---------------- sự kiện ---------------- */
document.querySelectorAll(".tab").forEach(b =>
  b.addEventListener("click", () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); }));

document.addEventListener("click", e => {
  const el = e.target.closest("button"); if (!el) return;

  if (el.dataset.goto) { tab = el.dataset.goto; render(); window.scrollTo(0, 0); return; }
  if (el.id === "pickerBtn") { showPicker = !showPicker; render(); return; }

  if (el.dataset.jump !== undefined) {
    const i = +el.dataset.jump, d = day();
    if (i < 0 || i >= d.exercises.length) return;
    exIdx = i; editIdx = null; render(); window.scrollTo(0, 0); return;
  }
  if (el.dataset.day) {
    curDay = el.dataset.day; exIdx = firstUnfinished(); editIdx = null; showPicker = false; render(); return;
  }
  if (el.dataset.alt !== undefined) {
    const d = day(), k = lkey(curDate, d.id, d.exercises[exIdx].id), want = el.dataset.alt;
    if ((S.swap[k] || "") === want) return;
    if ((S.log[k] || []).length) { toast("Xoá các set đã ghi rồi mới đổi"); return; }
    if (want) S.swap[k] = want; else delete S.swap[k];
    editIdx = null; save(true); render(); return;
  }
  if (el.dataset.delset !== undefined) {
    const i = +el.dataset.delset, d = day(), k = lkey(curDate, d.id, d.exercises[exIdx].id);
    const arr = S.log[k];
    if (!arr || !arr[i]) return;
    const gone = arr[i];
    arr.splice(i, 1);                       // các set sau tự dồn số lại
    if (!arr.length) delete S.log[k];       // xoá hẳn khoá để buổi rỗng không vào nhật ký
    editIdx = null;
    save(true);
    stopRest();                             // set không tính thì cũng không phải nghỉ
    toast(`Đã xoá set ${i + 1} · ${gone.kg}×${gone.reps}`);
    return;
  }
  if (el.dataset.edit !== undefined) {
    editIdx = editIdx === +el.dataset.edit ? null : +el.dataset.edit;
    stopRest(); return;
  }

  if (el.dataset.step) {
    const [f, dir] = el.dataset.step.split(":");
    const ex = eff(day().exercises[exIdx], curDate, day().id);
    const input = $(f === "kg" ? "#kgVal" : "#repVal");
    const step = f === "kg" ? (+ex.step || 2.5) : 1;
    let v = parseFloat(input.value); if (!isFinite(v)) v = 0;
    v = Math.max(0, Math.round((v + step * +dir) / step) * step);
    input.value = f === "kg" ? String(n1(v)) : String(Math.round(v));
    return;
  }
  if (el.id === "logSet") {
    const d = day(), ex = d.exercises[exIdx];
    const kg = $("#kgVal").value.trim(), reps = $("#repVal").value.trim();
    if (reps === "" || +reps <= 0) { toast("Nhập số rep đã"); return; }
    const k = lkey(curDate, d.id, ex.id);
    if (!S.log[k]) S.log[k] = [];
    S.log[k][editIdx != null ? editIdx : S.log[k].length] = { kg: kg === "" ? "0" : kg, reps };
    save(true);
    if (editIdx != null) { editIdx = null; render(); toast("Đã cập nhật"); return; }
    ensureAudio();
    startRest(+ex.rest || 120);
    return;
  }
  if (el.id === "cancelEdit") { editIdx = null; render(); return; }
  if (el.id === "restAdd") { restEnd += 30000; const n = $("#restNum");
    if (n) n.textContent = mmss(Math.ceil((restEnd - Date.now()) / 1000)); return; }
  if (el.id === "restSkip") { stopRest(); return; }

  if (el.id === "bwAdd") {
    const date = $("#bwDate").value, kg = parseFloat($("#bwKg").value);
    if (!date || !isFinite(kg)) { toast("Nhập cân nặng đã"); return; }
    S.bw = S.bw.filter(x => x.date !== date).concat([{ date, kg }]);
    S.profile.weight = kg; save(true); render(); toast("Đã ghi " + n1(kg) + " kg"); return;
  }
  if (el.dataset.delbw) { S.bw = S.bw.filter(x => x.date !== el.dataset.delbw); save(true); render(); return; }

  if (el.id === "addDay") { S.days.push({ id: uid(), name: "Buổi mới", exercises: [] }); save(true); render(); return; }
  if (el.dataset.delday) {
    const d = S.days.find(x => x.id === el.dataset.delday);
    if (S.days.length < 2) { toast("Phải còn ít nhất một buổi"); return; }
    if (d && confirm(`Xoá "${d.name}"?\nNhật ký cũ vẫn giữ nguyên.`)) {
      S.days = S.days.filter(x => x.id !== el.dataset.delday);
      if (curDay === el.dataset.delday) { curDay = S.days[0].id; exIdx = 0; }
      save(true); render();
    } return;
  }
  if (el.dataset.addex) {
    const d = S.days.find(x => x.id === el.dataset.addex);
    if (d) { d.exercises.push({ id: uid(), name: "Bài mới", sets: 3, reps: "8–10",
      unit: "kg", start: 20, step: 2.5, rest: 120, note: "" }); save(true); render(); }
    return;
  }
  if (el.dataset.addalt) {
    const [dayId, exId] = el.dataset.addalt.split("|");
    const d = S.days.find(x => x.id === dayId), ex = d && d.exercises.find(x => x.id === exId);
    if (ex) { (ex.alts = ex.alts || []).push({ id: uid(), name: "Bài thay thế", reps: ex.reps,
      unit: ex.unit, start: 0, step: ex.step || 2.5, note: "", fig: "" }); save(true); render(); }
    return;
  }
  if (el.dataset.delalt) {
    const [dayId, exId, altId] = el.dataset.delalt.split("|");
    const d = S.days.find(x => x.id === dayId), ex = d && d.exercises.find(x => x.id === exId);
    const a = ex && (ex.alts || []).find(x => x.id === altId);
    if (a && confirm(`Xoá bài thay thế "${a.name}"?\nCác set đã ghi vẫn giữ trong nhật ký.`)) {
      ex.alts = ex.alts.filter(x => x.id !== altId); save(true); render();
    } return;
  }
  if (el.dataset.delex) {
    const [dayId, exId] = el.dataset.delex.split("|");
    const d = S.days.find(x => x.id === dayId), ex = d && d.exercises.find(x => x.id === exId);
    if (ex && confirm(`Xoá bài "${ex.name}"?`)) {
      d.exercises = d.exercises.filter(x => x.id !== exId);
      if (exIdx >= d.exercises.length) exIdx = 0;
      save(true); render();
    } return;
  }

  if (el.id === "exportBtn") {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }));
    a.download = "so-sat-" + today() + ".json"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast("Đã xuất file"); return;
  }
  if (el.id === "installBtn") {
    if (!installPrompt) return;
    installPrompt.prompt();
    installPrompt.userChoice.finally(() => { installPrompt = null; render(); });
    return;
  }
  if (el.id === "importBtn") { $("#importFile").click(); return; }
  if (el.id === "resetBtn") {
    if (confirm("Khôi phục chương trình gốc?\nNhật ký và cân nặng vẫn được giữ.")) {
      const f = seed();
      S.days = f.days; S.progVersion = PROG_VERSION; curDay = S.days[0].id; exIdx = 0;
      save(true); render(); toast("Đã khôi phục");
    } return;
  }
});

const NUMFIELDS = ["age", "height", "weight", "goalWeight", "activity", "surplus", "proteinPerKg", "fatPerKg", "weeks"];
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id && el.id.startsWith("p-")) {
    const f = el.id.slice(2);
    S.profile[f] = NUMFIELDS.includes(f) ? (el.value === "" ? "" : +el.value) : el.value;
    save(); return;
  }
  if (el.dataset.dayname) {
    const d = S.days.find(x => x.id === el.dataset.dayname);
    if (d) { d.name = el.value; save(); renderTop(); } return;
  }
  if (el.dataset.ex) {
    const [dayId, exId, field] = el.dataset.ex.split("|");
    const d = S.days.find(x => x.id === dayId), ex = d && d.exercises.find(x => x.id === exId);
    if (!ex) return;
    ex[field] = ["sets", "start", "step", "rest"].includes(field) ? (+el.value || 0) : el.value;
    if (field === "sets" && ex.sets < 1) ex.sets = 1;
    save(); return;
  }
  if (el.dataset.altf) {
    const [dayId, exId, altId, field] = el.dataset.altf.split("|");
    const d = S.days.find(x => x.id === dayId), ex = d && d.exercises.find(x => x.id === exId);
    const a = ex && (ex.alts || []).find(x => x.id === altId);
    if (!a) return;
    a[field] = ["start", "step"].includes(field) ? (+el.value || 0) : el.value;
    save(); return;
  }
  if (el.id === "dateInput") {
    curDate = el.value || today(); curDay = autoDay(); exIdx = firstUnfinished(); editIdx = null; render();
  }
});

/* Vừa đủ (hoặc vừa thiếu) thông số → vẽ lại tab Tôi ở dạng tương ứng. */
let hadProfile = !!targets();
document.addEventListener("change", e => {
  if (tab === "me" && e.target.id && e.target.id.startsWith("p-") && !!targets() !== hadProfile) {
    hadProfile = !!targets(); render();
  }
});

document.addEventListener("change", e => {
  if (e.target.id !== "importFile") return;
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !d.profile || !Array.isArray(d.days) || !d.days.length) throw new Error("thiếu trường bắt buộc");
      S = migrate(d); curDay = autoDay(); exIdx = firstUnfinished(); hadProfile = !!targets();
      save(true); render(); toast("Đã nhập dữ liệu");
    } catch (err) { toast("File không đọc được: " + err.message); }
  };
  r.readAsText(f); e.target.value = "";
});

/* ---------------- cài đặt & offline ---------------- */
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); installPrompt = e;
  if (tab === "me") render();
});
window.addEventListener("appinstalled", () => { installPrompt = null; if (tab === "me") render(); });
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () =>
    navigator.serviceWorker.register("./sw.js").catch(() => { /* offline không bắt buộc */ }));
}

/* ---------------- khởi động ---------------- */
curDay = autoDay();
exIdx = firstUnfinished();
render();
</script>
</body>
</html>
