<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<title>Sổ Sắt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#0d1014;
  --surface:#161b1f;
  --raised:#1e242a;
  --line:#2a323b;
  --chalk:#e8eaed;
  --muted:#8792a0;
  --dim:#5d6772;
  --brass:#d99a2b;
  --brass-dim:#8a6320;
  --jade:#3fb98f;
  --rust:#c9563f;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--chalk);
  font-family:var(--body);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:620px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom))}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;background:var(--ground);
  padding:14px 0 10px;border-bottom:1px solid var(--line);
  margin-bottom:16px;
}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{
  font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;
  margin:0;text-transform:uppercase;
}
.brand h1 span{color:var(--brass)}
.stat{font-family:var(--display);font-size:15px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.stat b{color:var(--chalk);font-weight:600}

/* ---------- generic ---------- */
h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:19px;font-weight:600;margin:26px 0 10px;color:var(--chalk)}
h2:first-of-type{margin-top:6px}
.sub{color:var(--muted);font-size:13px;margin:-6px 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.small{font-size:13px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- controls ---------- */
button{font-family:inherit;font-size:15px;cursor:pointer}
.btn{
  background:var(--brass);color:#17120a;border:0;border-radius:10px;
  padding:13px 18px;font-weight:600;min-height:48px;width:100%;
}
.btn:active{background:#c08722}
.btn-ghost{
  background:transparent;color:var(--chalk);border:1px solid var(--line);
  border-radius:10px;padding:11px 16px;min-height:44px;font-weight:500;
}
.btn-ghost:active{background:var(--raised)}
.btn-sm{padding:7px 12px;min-height:36px;font-size:13px;width:auto}
.btn-danger{color:var(--rust);border-color:#4a2a24}
.icon-btn{
  background:transparent;border:1px solid var(--line);color:var(--muted);
  width:38px;height:38px;border-radius:9px;display:grid;place-items:center;
  font-size:18px;line-height:1;flex:none;
}
.icon-btn:active{background:var(--raised)}
input,select,textarea{
  font-family:var(--body);font-size:16px;background:var(--ground);color:var(--chalk);
  border:1px solid var(--line);border-radius:9px;padding:11px 12px;width:100%;
  min-height:46px;
}
input[type=number]{font-family:var(--display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;padding:9px 6px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
label.field{display:block}
label.field>span{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* ---------- day chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chip{
  background:var(--surface);border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:9px 16px;white-space:nowrap;min-height:42px;font-weight:500;
}
.chip[aria-pressed=true]{background:var(--brass);border-color:var(--brass);color:#17120a;font-weight:600}

/* ---------- exercise ---------- */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ex-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-name{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:.01em;line-height:1.2}
.ex-rx{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--brass);margin-top:3px;font-weight:500}
.ex-note{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.45}
.ex-body{padding:10px 14px 14px}
.last{
  font-size:12.5px;color:var(--muted);padding:8px 10px;background:var(--ground);
  border-radius:8px;margin-bottom:10px;border-left:2px solid var(--brass-dim);
}
.last b{color:var(--chalk);font-family:var(--display);font-size:14px;font-variant-numeric:tabular-nums}
.setrow{display:grid;grid-template-columns:34px 1fr 14px 1fr;align-items:center;gap:8px;margin-bottom:8px}
.setrow:last-child{margin-bottom:0}
.setno{font-family:var(--display);font-size:15px;color:var(--dim);text-align:center;font-weight:600}
.times{text-align:center;color:var(--dim);font-family:var(--display);font-size:15px}
.unit{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);text-align:center;margin-bottom:4px}

/* ---------- list rows ---------- */
.lrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.badge{font-family:var(--display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:var(--raised);color:var(--muted)}
.badge.up{background:#16302a;color:var(--jade)}
.badge.down{background:#33211d;color:var(--rust)}

/* ---------- nav ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(13,16,20,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(4,1fr);gap:2px;
}
.tab{
  background:transparent;border:0;color:var(--dim);padding:8px 2px 6px;
  display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:9px;min-height:52px;
}
.tab span:first-child{font-size:19px;line-height:1}
.tab span:last-child{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:500}
.tab[aria-current=page]{color:var(--brass)}

.empty{text-align:center;color:var(--dim);padding:36px 16px;font-size:14px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));
  background:var(--jade);color:#08201a;padding:11px 20px;border-radius:999px;font-weight:600;font-size:14px;
  z-index:50;opacity:0;pointer-events:none;transition:opacity .18s;white-space:nowrap;
}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>Sổ <span>Sắt</span></h1>
      <div class="stat" id="hdrStat"></div>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav>
  <button class="tab" data-tab="train"><span>🏋</span><span>Tập</span></button>
  <button class="tab" data-tab="history"><span>📓</span><span>Nhật ký</span></button>
  <button class="tab" data-tab="body"><span>⚖</span><span>Cơ thể</span></button>
  <button class="tab" data-tab="program"><span>⚙</span><span>Chương trình</span></button>
</nav>
<div class="toast" id="toast"></div>
<script>
"use strict";
const KEY = "soSat.v1";
const uid = () => Math.random().toString(36).slice(2, 9);
const today = () => new Date().toISOString().slice(0, 10);
const $ = (s, r = document) => r.querySelector(s);

/* ---------------- seed: chương trình 8 tuần, 54kg / 1m72 ---------------- */
function seed() {
  return {
    profile: {
      name: "", sex: "m", age: "", height: "", weight: "",
      activity: 1.6, surplus: 450, proteinPerKg: 2.0, fatPerKg: 1.2,
      goalWeight: "", startDate: today(), weeks: 8,
    },
    days: [
      { id: "a", name: "Buổi A", exercises: [
        { id: uid(), name: "Back Squat",           sets: 3, reps: "6–8",       unit: "kg",     note: "Bài chính, tập đầu buổi. Xuống tới đùi song song sàn. Khởi điểm 30kg (đòn 20 + 5/bên)." },
        { id: uid(), name: "Bench Press",          sets: 3, reps: "6–10",      unit: "kg",     note: "Thay hoàn toàn push up. Khởi điểm 30kg." },
        { id: uid(), name: "Xà đeo tạ",            sets: 4, reps: "5–8",       unit: "+kg",    note: "Balo hoặc đai tạ. Đủ 8 rep ở set cuối 2 buổi liên tiếp → +2.5kg. Khởi điểm +5kg." },
        { id: uid(), name: "Romanian Deadlift",    sets: 3, reps: "8–10",      unit: "kg",     note: "Đùi sau — nhóm cơ đang trống. Đẩy hông ra sau, lưng thẳng. Khởi điểm 35kg." },
        { id: uid(), name: "Face Pull",            sets: 3, reps: "15",        unit: "kg",     note: "Chống vai gù do ngồi code. Nhẹ thôi, siết bả vai." },
        { id: uid(), name: "Hanging Leg Raise",    sets: 3, reps: "10–15",     unit: "+kg",    note: "Tay không. Không đu người." },
      ]},
      { id: "b", name: "Buổi B", exercises: [
        { id: uid(), name: "Deadlift",             sets: 3, reps: "5",         unit: "kg",     note: "Tuần 1–2 tập nhẹ học form, đừng ăn thua. Khởi điểm 40kg." },
        { id: uid(), name: "Overhead Press",       sets: 3, reps: "6–8",       unit: "kg",     note: "Pattern đẩy dọc — trước giờ chưa có. Khởi điểm đòn không 20kg." },
        { id: uid(), name: "Barbell Row",          sets: 4, reps: "8–10",      unit: "kg",     note: "Kéo ngang — nhóm cơ đang trống. Khởi điểm 30kg." },
        { id: uid(), name: "Bulgarian Split Squat",sets: 3, reps: "8–10/chân", unit: "kg/tay", note: "Rất hợp dân đá banh. Khởi điểm 6kg mỗi tay." },
        { id: uid(), name: "Lateral Raise",        sets: 3, reps: "12–15",     unit: "kg/tay", note: "Vai ngang, nở vai. Khởi điểm 3kg." },
        { id: uid(), name: "Hammer Curl",          sets: 3, reps: "10–12",     unit: "kg/tay", note: "Khởi điểm 6kg." },
      ]},
    ],
    log: {},   // "YYYY-MM-DD|dayId|exId" -> [{kg,reps}]
    bw: [],    // [{date, kg}]
  };
}

/* ---------------- state ---------------- */
let S = load();
let tab = targets() ? "train" : "body";
let curDay = S.days[0] ? S.days[0].id : null;
let curDate = today();
let renderedProfileOk = null;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && d.profile && Array.isArray(d.days)) return d;
    }
  } catch (e) { /* dữ liệu hỏng hoặc bị chặn — dùng bản mặc định */ }
  return seed();
}
let saveTimer = null;
function save(now) {
  clearTimeout(saveTimer);
  const write = () => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { toast("Không lưu được — bộ nhớ trình duyệt bị chặn"); }
  };
  now ? write() : (saveTimer = setTimeout(write, 350));
}

let toastTimer = null;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1900);
}

/* ---------------- tính toán ---------------- */
/** null khi chưa đủ tuổi / chiều cao / cân nặng để tính. */
function targets() {
  const p = S.profile, w = +p.weight, h = +p.height, a = +p.age;
  if (!(w > 0 && h > 0 && a > 0)) return null;
  const bmr = 10 * w + 6.25 * h - 5 * a + (p.sex === "m" ? 5 : -161);
  const tdee = bmr * (+p.activity || 1.5);
  const kcal = tdee + (+p.surplus || 0);
  const protein = w * (+p.proteinPerKg || 2);
  const fat = w * (+p.fatPerKg || 1);
  const carb = Math.max(0, (kcal - protein * 4 - fat * 9) / 4);
  return { bmr, tdee, kcal, protein, fat, carb };
}
function weekNo(dateStr) {
  const start = new Date(S.profile.startDate + "T00:00:00");
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(start) || isNaN(d)) return 1;
  return Math.max(1, Math.floor((d - start) / 604800000) + 1);
}
function logKey(date, dayId, exId) { return date + "|" + dayId + "|" + exId; }

/** Buổi gần nhất TRƯỚC ngày đang mở có ghi bài này. */
function lastPerf(exId, beforeDate) {
  let best = null;
  for (const k in S.log) {
    const [d, , ex] = k.split("|");
    if (ex !== exId || d >= beforeDate) continue;
    const sets = (S.log[k] || []).filter(s => s.kg !== "" || s.reps !== "");
    if (!sets.length) continue;
    if (!best || d > best.date) best = { date: d, sets };
  }
  return best;
}
function sessionDates() {
  const set = new Set();
  for (const k in S.log) {
    if ((S.log[k] || []).some(s => s.kg !== "" || s.reps !== "")) set.add(k.split("|")[0]);
  }
  return [...set].sort().reverse();
}
const fmtDate = s => { const [y, m, d] = s.split("-"); return d + "/" + m; };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n1 = v => Math.round(v * 10) / 10;

/* ---------------- render: TẬP ---------------- */
function viewTrain() {
  const day = S.days.find(d => d.id === curDay) || S.days[0];
  if (!day) return `<div class="empty">Chưa có buổi tập nào.<br>Sang tab <b>Chương trình</b> để tạo.</div>`;
  curDay = day.id;

  const chips = S.days.map(d =>
    `<button class="chip" data-day="${d.id}" aria-pressed="${d.id === day.id}">${esc(d.name)}</button>`).join("");

  const exs = day.exercises.map(ex => {
    const key = logKey(curDate, day.id, ex.id);
    const cur = S.log[key] || [];
    const prev = lastPerf(ex.id, curDate);
    const prevHtml = prev
      ? `<div class="last">Lần trước · ${fmtDate(prev.date)} — ` +
        prev.sets.map(s => `<b>${esc(s.kg || "0")}</b>×<b>${esc(s.reps || "0")}</b>`).join(" &nbsp;") + `</div>`
      : `<div class="last dim">Chưa có dữ liệu buổi trước — buổi này là mốc gốc.</div>`;

    const rows = Array.from({ length: +ex.sets || 1 }, (_, i) => {
      const s = cur[i] || { kg: "", reps: "" };
      return `<div class="setrow">
        <div class="setno">${i + 1}</div>
        <input type="number" inputmode="decimal" step="0.5" placeholder="–" value="${esc(s.kg)}"
               data-log="${key}" data-i="${i}" data-f="kg" aria-label="Set ${i + 1} mức tạ">
        <div class="times">×</div>
        <input type="number" inputmode="numeric" step="1" placeholder="–" value="${esc(s.reps)}"
               data-log="${key}" data-i="${i}" data-f="reps" aria-label="Set ${i + 1} số rep">
      </div>`;
    }).join("");

    return `<article class="ex">
      <div class="ex-head">
        <div>
          <div class="ex-name">${esc(ex.name)}</div>
          <div class="ex-rx">${esc(ex.sets)} set × ${esc(ex.reps)}</div>
        </div>
      </div>
      <div class="ex-body">
        ${ex.note ? `<div class="ex-note" style="margin:0 0 10px">${esc(ex.note)}</div>` : ""}
        ${prevHtml}
        <div class="grid2" style="grid-template-columns:34px 1fr 14px 1fr;display:grid;gap:8px;margin-bottom:2px">
          <div></div><div class="unit">${esc(ex.unit || "kg")}</div><div></div><div class="unit">rep</div>
        </div>
        ${rows}
      </div>
    </article>`;
  }).join("");

  return `
    <label class="field" style="margin-bottom:12px">
      <span>Ngày tập · tuần ${weekNo(curDate)}/${esc(S.profile.weeks)}</span>
      <input type="date" id="dateInput" value="${curDate}">
    </label>
    <div class="chips" style="margin-bottom:16px">${chips}</div>
    <div class="stack">${exs || `<div class="empty">Buổi này chưa có bài nào.</div>`}</div>
    <p class="small dim" style="margin-top:16px;text-align:center">Số nhập vào tự lưu trên máy này.</p>`;
}

/* ---------------- render: NHẬT KÝ ---------------- */
function viewHistory() {
  const dates = sessionDates();
  if (!dates.length) return `<div class="empty">Chưa ghi buổi nào.<br>Vào tab <b>Tập</b> và nhập set đầu tiên.</div>`;

  const items = dates.map(date => {
    const parts = [];
    for (const day of S.days) {
      for (const ex of day.exercises) {
        const sets = (S.log[logKey(date, day.id, ex.id)] || []).filter(s => s.kg !== "" || s.reps !== "");
        if (sets.length) {
          const top = sets.reduce((m, s) => Math.max(m, +s.kg || 0), 0);
          const vol = sets.reduce((t, s) => t + (+s.kg || 0) * (+s.reps || 0), 0);
          parts.push({ day: day.name, name: ex.name, sets, top, vol });
        }
      }
    }
    const vol = parts.reduce((t, p) => t + p.vol, 0);
    const dayName = parts.length ? parts[0].day : "";
    return `<div class="card">
      <div class="spread" style="margin-bottom:10px">
        <div>
          <div class="num" style="font-size:20px">${fmtDate(date)} · ${esc(dayName)}</div>
          <div class="small muted">Tuần ${weekNo(date)} · ${parts.length} bài</div>
        </div>
        <div style="text-align:right">
          <div class="num" style="font-size:20px;color:var(--brass)">${Math.round(vol).toLocaleString("vi-VN")}</div>
          <div class="small dim">kg tổng khối lượng</div>
        </div>
      </div>
      ${parts.map(p => `<div class="lrow">
        <div>${esc(p.name)}</div>
        <div class="num muted small">${p.sets.map(s => `${esc(s.kg || 0)}×${esc(s.reps || 0)}`).join("  ")}</div>
      </div>`).join("")}
    </div>`;
  }).join("");

  return `<h2>Nhật ký</h2><div class="sub">${dates.length} buổi đã ghi. Khối lượng = tạ × rep cộng dồn cả buổi.</div>
    <div class="stack">${items}</div>`;
}

/* ---------------- render: CƠ THỂ ---------------- */
function viewBody() {
  const p = S.profile, t = targets();

  const profileCard = `
  <div class="card stack">
    <div class="grid2">
      <label class="field"><span>Tên</span><input id="p-name" value="${esc(p.name)}" placeholder="Tuỳ bạn"></label>
      <label class="field"><span>Tuổi</span><input type="number" inputmode="numeric" id="p-age" value="${esc(p.age)}" placeholder="29"></label>
      <label class="field"><span>Chiều cao (cm)</span><input type="number" inputmode="numeric" id="p-height" value="${esc(p.height)}" placeholder="172"></label>
      <label class="field"><span>Cân nặng (kg)</span><input type="number" step="0.1" inputmode="decimal" id="p-weight" value="${esc(p.weight)}" placeholder="54"></label>
      <label class="field"><span>Cân nặng mục tiêu</span><input type="number" step="0.1" inputmode="decimal" id="p-goalWeight" value="${esc(p.goalWeight)}" placeholder="57"></label>
      <label class="field"><span>Giới tính</span><select id="p-sex">
        <option value="m"${p.sex === "m" ? " selected" : ""}>Nam</option>
        <option value="f"${p.sex === "f" ? " selected" : ""}>Nữ</option></select></label>
    </div>
    <label class="field"><span>Mức vận động</span><select id="p-activity">
      <option value="1.2"${+p.activity === 1.2 ? " selected" : ""}>1.2 — ngồi cả ngày, không tập</option>
      <option value="1.375"${+p.activity === 1.375 ? " selected" : ""}>1.375 — tập nhẹ 1–2 buổi/tuần</option>
      <option value="1.55"${+p.activity === 1.55 ? " selected" : ""}>1.55 — tập 3–4 buổi/tuần</option>
      <option value="1.6"${+p.activity === 1.6 ? " selected" : ""}>1.6 — tập 3 buổi + chơi thể thao</option>
      <option value="1.725"${+p.activity === 1.725 ? " selected" : ""}>1.725 — tập 6 buổi/tuần</option>
    </select></label>
    <div class="grid3">
      <label class="field"><span>Dư kcal</span><input type="number" step="50" inputmode="numeric" id="p-surplus" value="${esc(p.surplus)}"></label>
      <label class="field"><span>Đạm g/kg</span><input type="number" step="0.1" inputmode="decimal" id="p-proteinPerKg" value="${esc(p.proteinPerKg)}"></label>
      <label class="field"><span>Béo g/kg</span><input type="number" step="0.1" inputmode="decimal" id="p-fatPerKg" value="${esc(p.fatPerKg)}"></label>
    </div>
    <div class="grid2">
      <label class="field"><span>Ngày bắt đầu</span><input type="date" id="p-startDate" value="${esc(p.startDate)}"></label>
      <label class="field"><span>Số tuần</span><input type="number" inputmode="numeric" id="p-weeks" value="${esc(p.weeks)}"></label>
    </div>
  </div>`;

  if (!t) return `
    <h2>Thiết lập</h2>
    <div class="sub">Nhập tuổi, chiều cao và cân nặng — trang sẽ tự tính mục tiêu calo, đạm và theo dõi tiến độ.
    Số liệu chỉ nằm trong trình duyệt của máy này, không gửi đi đâu cả.</div>
    ${profileCard}
    <p class="small dim" style="margin-top:16px;text-align:center">Giáo án 8 tuần đã có sẵn ở tab <b>Tập</b> — bạn tập được ngay, không cần điền gì.</p>`;

  const bw = [...S.bw].sort((a, b) => b.date.localeCompare(a.date));
  const latest = bw[0] ? bw[0].kg : p.weight;
  const bmi = (+latest) / Math.pow(p.height / 100, 2);
  const goal = +p.goalWeight || 0;
  const toGo = goal ? goal - (+latest || 0) : 0;

  const rows = bw.map((e, i) => {
    const prev = bw[i + 1];
    const d = prev ? n1(e.kg - prev.kg) : null;
    const badge = d === null ? "" : `<span class="badge ${d > 0 ? "up" : d < 0 ? "down" : ""}">${d > 0 ? "+" : ""}${d} kg</span>`;
    return `<div class="lrow">
      <div class="row"><span class="num" style="font-size:19px;width:64px">${e.kg} kg</span>${badge}</div>
      <div class="row"><span class="small muted">${fmtDate(e.date)}</span>
        <button class="icon-btn" data-delbw="${e.date}" aria-label="Xoá mốc cân ngày ${fmtDate(e.date)}">×</button></div>
    </div>`;
  }).join("");

  return `
  <h2>Cân nặng</h2>
  <div class="sub">Mốc quan trọng nhất. Cân buổi sáng, sau khi đi vệ sinh, trước khi ăn — cùng một điều kiện mỗi lần.</div>
  <div class="card">
    <div class="grid3" style="text-align:center;margin-bottom:14px">
      <div><div class="num" style="font-size:26px">${n1(latest)}</div><div class="small dim">hiện tại (kg)</div></div>
      <div><div class="num" style="font-size:26px;color:${bmi < 18.5 ? "var(--rust)" : "var(--jade)"}">${n1(bmi)}</div><div class="small dim">BMI</div></div>
      <div><div class="num" style="font-size:26px;color:var(--brass)">${goal ? (toGo > 0 ? "+" : "") + n1(toGo) : "–"}</div><div class="small dim">còn tới mục tiêu</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end">
      <label class="field"><span>Ngày</span><input type="date" id="bwDate" value="${today()}"></label>
      <label class="field"><span>Cân nặng (kg)</span><input type="number" step="0.1" inputmode="decimal" id="bwKg" placeholder="${n1(latest)}"></label>
      <button class="btn-ghost" id="bwAdd" style="min-width:64px">Ghi</button>
    </div>
  </div>
  ${bw.length ? `<div class="card" style="margin-top:12px">${rows}</div>` : ""}

  <h2>Mục tiêu dinh dưỡng</h2>
  <div class="sub">Tính lại mỗi khi bạn đổi cân nặng. Công thức Mifflin–St Jeor, sai số ±10% — cái cân mới là trọng tài, không phải con số này.</div>
  <div class="card">
    <div class="grid2" style="text-align:center;gap:14px">
      <div><div class="num" style="font-size:28px;color:var(--brass)">${Math.round(t.kcal)}</div><div class="small dim">kcal / ngày</div></div>
      <div><div class="num" style="font-size:28px">${Math.round(t.protein)}<span style="font-size:16px"> g</span></div><div class="small dim">đạm / ngày</div></div>
      <div><div class="num" style="font-size:20px">${Math.round(t.carb)}<span style="font-size:14px"> g</span></div><div class="small dim">tinh bột</div></div>
      <div><div class="num" style="font-size:20px">${Math.round(t.fat)}<span style="font-size:14px"> g</span></div><div class="small dim">chất béo</div></div>
    </div>
    <div class="small muted" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
      Chuyển hoá cơ bản ${Math.round(t.bmr)} kcal · duy trì ${Math.round(t.tdee)} kcal · dư ${esc(p.surplus)} kcal
      → tăng khoảng <b style="color:var(--chalk)">${n1((+p.surplus || 0) / 1100)} kg/tuần</b>.
    </div>
  </div>

  <h2>Ăn thế nào cho đủ</h2>
  <div class="sub">Ăn đủ ${Math.round(t.kcal)} kcal khó hơn tập. Khung tham khảo dưới đây ≈ 2 750 kcal / 145 g đạm — chỉnh khẩu phần theo mục tiêu của bạn.</div>
  <div class="card">
    <div class="lrow"><div><b>Sáng</b><div class="small muted">3 trứng + 2 lát bánh mì + 500 ml sữa</div></div><div class="num muted">~750</div></div>
    <div class="lrow"><div><b>Trưa</b><div class="small muted">2 chén cơm + 150 g thịt/cá + rau</div></div><div class="num muted">~800</div></div>
    <div class="lrow"><div><b>Trước tập</b><div class="small muted">1 quả chuối + 30 g bơ đậu phộng</div></div><div class="num muted">~300</div></div>
    <div class="lrow"><div><b>Tối</b><div class="small muted">2 chén cơm + 100 g ức gà + 1 trứng + rau</div></div><div class="num muted">~750</div></div>
    <div class="lrow"><div><b>Trước ngủ</b><div class="small muted">1 scoop whey hoặc 250 ml sữa</div></div><div class="num muted">~150</div></div>
    <div class="small dim" style="margin-top:10px">Sữa và bơ đậu phộng là cách rẻ nhất để thêm calo mà không thấy no.</div>
  </div>

  <h2>Thông số cá nhân</h2>
  ${profileCard}`;
}

/* ---------------- render: CHƯƠNG TRÌNH ---------------- */
function viewProgram() {
  const days = S.days.map(day => `
    <div class="card">
      <div class="spread" style="margin-bottom:12px">
        <input value="${esc(day.name)}" data-day-name="${day.id}" aria-label="Tên buổi"
               style="font-family:var(--display);font-size:20px;font-weight:600;border:0;background:transparent;padding:4px 0;min-height:auto">
        <button class="icon-btn btn-danger" data-del-day="${day.id}" aria-label="Xoá buổi">×</button>
      </div>
      ${day.exercises.map(ex => `
        <div style="padding:12px 0;border-top:1px solid var(--line)">
          <div class="row" style="margin-bottom:8px">
            <input value="${esc(ex.name)}" data-ex="${day.id}|${ex.id}|name" aria-label="Tên bài">
            <button class="icon-btn btn-danger" data-del-ex="${day.id}|${ex.id}" aria-label="Xoá bài">×</button>
          </div>
          <div class="grid3" style="margin-bottom:8px">
            <label class="field"><span>Set</span><input type="number" value="${esc(ex.sets)}" data-ex="${day.id}|${ex.id}|sets"></label>
            <label class="field"><span>Rep</span><input value="${esc(ex.reps)}" data-ex="${day.id}|${ex.id}|reps" style="font-family:var(--display);font-size:19px;text-align:center;padding:9px 6px"></label>
            <label class="field"><span>Đơn vị</span><input value="${esc(ex.unit)}" data-ex="${day.id}|${ex.id}|unit" style="font-size:14px;text-align:center;padding:12px 6px"></label>
          </div>
          <textarea rows="2" placeholder="Ghi chú kỹ thuật…" data-ex="${day.id}|${ex.id}|note" style="font-size:13px">${esc(ex.note)}</textarea>
        </div>`).join("")}
      <button class="btn-ghost btn-sm" data-add-ex="${day.id}" style="margin-top:12px">+ Thêm bài</button>
    </div>`).join("");

  return `
    <h2>Chương trình</h2>
    <div class="sub">Sửa gì cũng được — tên bài, số set, rep, ghi chú. Lưu ngay khi gõ.</div>
    <div class="stack">${days}</div>
    <button class="btn-ghost" id="addDay" style="margin-top:12px">+ Thêm buổi tập</button>

    <h2>Dữ liệu</h2>
    <div class="sub">Mọi thứ nằm trong trình duyệt máy này. Xoá dữ liệu duyệt web là mất — xuất file định kỳ.</div>
    <div class="card stack">
      <button class="btn-ghost" id="exportBtn">⬇ Xuất file JSON</button>
      <button class="btn-ghost" id="importBtn">⬆ Nhập từ file JSON</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <button class="btn-ghost btn-danger" id="resetBtn">Khôi phục chương trình gốc</button>
    </div>`;
}

/* ---------------- render ---------------- */
function render() {
  const t = targets();
  renderedProfileOk = !!t;
  const bw = [...S.bw].sort((a, b) => b.date.localeCompare(a.date));
  const w = bw[0] ? bw[0].kg : S.profile.weight;
  $("#hdrStat").innerHTML = t
    ? `<b>${n1(w)}</b> kg · <b>${Math.round(t.kcal)}</b> kcal`
    : `<span style="color:var(--brass)">Chưa có thông số</span>`;

  $("#view").innerHTML =
    tab === "train" ? viewTrain() :
    tab === "history" ? viewHistory() :
    tab === "body" ? viewBody() : viewProgram();

  document.querySelectorAll(".tab").forEach(b => {
    if (b.dataset.tab === tab) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  window.scrollTo(0, 0);
}

/* ---------------- events ---------------- */
document.querySelectorAll(".tab").forEach(b =>
  b.addEventListener("click", () => { tab = b.dataset.tab; render(); }));

document.addEventListener("input", e => {
  const el = e.target;

  if (el.dataset.log !== undefined) {          // ô nhập set
    const key = el.dataset.log, i = +el.dataset.i;
    if (!S.log[key]) S.log[key] = [];
    while (S.log[key].length <= i) S.log[key].push({ kg: "", reps: "" });
    S.log[key][i][el.dataset.f] = el.value;
    save(); return;
  }
  if (el.id && el.id.startsWith("p-")) {        // thông số cá nhân
    const f = el.id.slice(2);
    S.profile[f] = ["name", "sex", "startDate"].includes(f) ? el.value : (el.value === "" ? "" : +el.value);
    save();
    if (["weight", "height", "age", "sex", "activity", "surplus", "proteinPerKg", "fatPerKg", "goalWeight"].includes(f)) {
      const t = targets(), bw = [...S.bw].sort((a, b) => b.date.localeCompare(a.date));
      $("#hdrStat").innerHTML = t
        ? `<b>${n1(bw[0] ? bw[0].kg : S.profile.weight)}</b> kg · <b>${Math.round(t.kcal)}</b> kcal`
        : `<span style="color:var(--brass)">Chưa có thông số</span>`;
    }
    return;
  }
  if (el.dataset.dayName) {
    const d = S.days.find(x => x.id === el.dataset.dayName);
    if (d) { d.name = el.value; save(); } return;
  }
  if (el.dataset.ex) {
    const [dayId, exId, field] = el.dataset.ex.split("|");
    const day = S.days.find(x => x.id === dayId);
    const ex = day && day.exercises.find(x => x.id === exId);
    if (ex) { ex[field] = field === "sets" ? (+el.value || 1) : el.value; save(); }
    return;
  }
  if (el.id === "dateInput") { curDate = el.value || today(); render(); }
});

document.addEventListener("click", e => {
  const el = e.target.closest("button");
  if (!el) return;

  if (el.dataset.day) { curDay = el.dataset.day; render(); return; }

  if (el.id === "bwAdd") {
    const date = $("#bwDate").value, kg = parseFloat($("#bwKg").value);
    if (!date || !isFinite(kg)) { toast("Nhập cân nặng đã"); return; }
    S.bw = S.bw.filter(x => x.date !== date).concat([{ date, kg }]);
    S.profile.weight = kg;
    save(true); render(); toast("Đã ghi " + n1(kg) + " kg"); return;
  }
  if (el.dataset.delbw) {
    S.bw = S.bw.filter(x => x.date !== el.dataset.delbw);
    save(true); render(); return;
  }

  if (el.id === "addDay") {
    S.days.push({ id: uid(), name: "Buổi mới", exercises: [] });
    save(true); render(); return;
  }
  if (el.dataset.delDay) {
    const d = S.days.find(x => x.id === el.dataset.delDay);
    if (d && confirm(`Xoá "${d.name}" và toàn bộ bài trong đó?\nNhật ký cũ vẫn giữ nguyên.`)) {
      S.days = S.days.filter(x => x.id !== el.dataset.delDay);
      if (curDay === el.dataset.delDay) curDay = S.days[0] ? S.days[0].id : null;
      save(true); render();
    } return;
  }
  if (el.dataset.addEx) {
    const d = S.days.find(x => x.id === el.dataset.addEx);
    if (d) { d.exercises.push({ id: uid(), name: "Bài mới", sets: 3, reps: "8–10", unit: "kg", note: "" }); save(true); render(); }
    return;
  }
  if (el.dataset.delEx) {
    const [dayId, exId] = el.dataset.delEx.split("|");
    const d = S.days.find(x => x.id === dayId);
    const ex = d && d.exercises.find(x => x.id === exId);
    if (ex && confirm(`Xoá bài "${ex.name}"?`)) {
      d.exercises = d.exercises.filter(x => x.id !== exId); save(true); render();
    } return;
  }

  if (el.id === "exportBtn") {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "so-sat-" + today() + ".json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast("Đã xuất file"); return;
  }
  if (el.id === "importBtn") { $("#importFile").click(); return; }
  if (el.id === "resetBtn") {
    if (confirm("Khôi phục chương trình gốc?\nNhật ký và cân nặng vẫn được giữ.")) {
      const fresh = seed();
      S.days = fresh.days; S.profile = Object.assign(fresh.profile, { startDate: S.profile.startDate });
      curDay = S.days[0].id; save(true); render(); toast("Đã khôi phục");
    } return;
  }
});

/* Thông số vừa đủ (hoặc vừa thiếu) → vẽ lại tab Cơ thể ở dạng tương ứng. */
document.addEventListener("change", e => {
  if (tab === "body" && e.target.id && e.target.id.startsWith("p-") && !!targets() !== renderedProfileOk) render();
});

$("#importFile").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !d.profile || !Array.isArray(d.days)) throw new Error("thiếu trường bắt buộc");
      S = d; curDay = S.days[0] ? S.days[0].id : null;
      save(true); render(); toast("Đã nhập dữ liệu");
    } catch (err) { toast("File không đọc được: " + err.message); }
  };
  r.readAsText(f);
  e.target.value = "";
});

render();
</script>
</body>
</html>
